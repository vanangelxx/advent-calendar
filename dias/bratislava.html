<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Día 04 · Bratislava</title>
  <link rel="stylesheet" href="dias.css">

  <style>
    /* MAPA */

    .map {
      position: relative;
      width: min(100%, 1100px);
      margin: 0 auto;
    }

    .map-image {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--gold, #C9A76B);
    }

    /* PUNTOS DE UBICACIÓN */

    .pin {
      position: absolute;
      width: clamp(22px, 3.2vw, 34px);
      height: clamp(22px, 3.2vw, 34px);
      padding: 0;
      border: 2px solid var(--paper, #F8F0E2);
      border-radius: 50% 50% 50% 0;
      background: var(--burgundy, #762E36);
      box-shadow: 0 3px 8px rgba(0, 0, 0, .3);
      cursor: pointer;
      transform: translate(-50%, -100%) rotate(-45deg);
      transform-origin: center;
      transition: transform .2s ease, background .2s ease;
    }

    /* puntito central del pin */
    .pin::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 34%;
      height: 34%;
      border-radius: 50%;
      background: var(--paper, #F8F0E2);
      transform: translate(-50%, -50%);
    }

    .pin:hover,
    .pin:focus-visible {
      background: var(--green, #18372E);
      transform: translate(-50%, -100%) rotate(-45deg) scale(1.2);
      outline: none;
    }

    /* VENTANA AL PULSAR UN PUNTO */

    .place-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(24, 55, 46, .5);
    }

    .place-modal.active {
      display: flex;
    }

    .place-card {
      position: relative;
      width: min(100%, 460px);
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px 26px;
      background: var(--paper, #F8F0E2);
      border: 1px solid var(--gold, #C9A76B);
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, .25);
      animation: appear .3s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .place-card h2 {
      margin: 0 0 14px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 500;
      color: var(--burgundy, #762E36);
    }

    .place-card img {
      display: block;
      width: 100%;
      max-height: 280px;
      margin: 0 auto 16px;
      object-fit: cover;
      border: 1px solid var(--gold, #C9A76B);
    }

    .place-card p {
      margin: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      line-height: 1.4;
      color: var(--green, #18372E);
    }

    .place-close {
      position: absolute;
      top: 6px;
      right: 12px;
      border: none;
      background: none;
      font-size: 28px;
      color: var(--burgundy, #762E36);
      cursor: pointer;
    }

    /* Modo ajuste (añade ?editar al final de la dirección) */
    .coords {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 200;
      padding: 8px 12px;
      background: #000;
      color: #fff;
      font: 14px monospace;
      display: none;
    }
  </style>
</head>
<body class="day-body day-body--template">
  <main class="day-frame day-template">
    <div class="template-content">

      <header class="template-heading">
        <p class="template-eyebrow">Día 04 · Adviento 2026</p>
        <h1>Bratislava</h1>
        <p class="template-intro">Pulsa los puntos del mapa para descubrir recuerdos.</p>
      </header>

      <!-- MAPA -->
      <div class="map" id="map">
        <img class="map-image" src="../imagenes/mapa-bratislava.png" alt="Mapa de Bratislava">

        <!-- PUNTOS: left y top son porcentajes del mapa -->
        <button class="pin" style="left: 9%; top: 69%;" data-place="lugar1"  aria-label="Lugar 1"></button>
        <button class="pin" style="left: 40%; top: 3%;" data-place="lugar2"  aria-label="Lugar 2"></button>
        <button class="pin" style="left: 60%; top: 49%;" data-place="lugar3"  aria-label="Lugar 3"></button>
        <button class="pin" style="left: 10%; top: 20%;" data-place="lugar4"  aria-label="Lugar 4"></button>
        <button class="pin" style="left: 69%; top: 94%;" data-place="lugar5"  aria-label="Lugar 5"></button>
        <button class="pin" style="left: 22%; top: 56%;" data-place="lugar6"  aria-label="Lugar 6"></button>
        <button class="pin" style="left: 35%; top: 48%;" data-place="lugar7"  aria-label="Lugar 7"></button>
        <button class="pin" style="left: 63%; top: 52%;" data-place="lugar8"  aria-label="Lugar 8"></button>
        <button class="pin" style="left: 43%; top: 47%;" data-place="lugar9"  aria-label="Lugar 9"></button>
        <button class="pin" style="left: 85%; top: 98%;" data-place="lugar10" aria-label="Lugar 10"></button>
        <button class="pin" style="left: 47%; top: 58%;" data-place="lugar11"  aria-label="Lugar 11"></button>
        <button class="pin" style="left: 45%; top: 65%;" data-place="lugar12" aria-label="Lugar 12"></button>
      </div>

    </div>
  </main>

  <!-- VENTANA -->
  <div class="place-modal" id="place-modal">
    <div class="place-card">
      <button class="place-close" id="place-close" aria-label="Cerrar">×</button>
      <h2 id="place-title"></h2>
      <img id="place-photo" src="" alt="">
      <p id="place-text"></p>
    </div>
  </div>

  <div class="coords" id="coords"></div>

  <a href="../index.html" class="back-link">← Volver al calendario</a>

  <script>
    /* TÍTULO, FOTO Y TEXTO DE CADA PUNTO */

    const places = {
      lugar1:  { title: "Tú resi",  photo: "../imagenes/bratislava-1.jpg",  text: "Mira, lo que mas hacías en tu resi. jajaja." },
      lugar2:  { title: "Slavin",  photo: "../imagenes/bratislava-2.jpg",  text: "Me encanto este lugar, sobretodo por que fuí contigo." },
      lugar3:  { title: "Mi resi",  photo: "../imagenes/bratislava-3.jpg",  text: "Madre mía las madrugadas que nos pegamos esperando en su puerta." },
      lugar4:  { title: "Paseo",  photo: "../imagenes/bratislava-4.jpg",  text: "Ves algún ciervo en la foto? Espero que no jajjajaja." },
      lugar5:  { title: "Chino",  photo: "../imagenes/bratislava-5.jpg",  text: "Cuando todavía nos daban bebida y sopa con el menu." },
      lugar6:  { title: "Río",  photo: "../imagenes/bratislava-6.jpg",  text: "Muchos de los recuerdos más bonitos que tengo de la cuidad son ahí." },
      lugar7:  { title: "Deep club",  photo: "../imagenes/bratislava-7.jpg",  text: "Lo mejor era ponerse a jugar al futbolín con eslovacos borrachos." },
      lugar8:  { title: "Foosbar",  photo: "../imagenes/bratislava-8.jpg",  text: "Fuaaaa tengo ganas de volver a jugaaaaar." },
      lugar9:  { title: "Viking",  photo: "../imagenes/bratislava-9.jpg",  text: "Está bien bueno, por lo menos a Manel parece que le gusta." },
      lugar10: { title: "Piso Fer", photo: "../imagenes/bratislava-10.jpg", text: "Las previas allí eran lo mejor." },
      lugar11:  { title: "1,80",  photo: "../imagenes/bratislava-11.jpg",  text: "Eh! Aquí empezamos todos a jugar al futbolín. De nada." },
      lugar12: { title: "Tubos", photo: "../imagenes/bratislava-12.jpg", text: "La mejor despdedida al parecer... vaya." }
    };

    const modal = document.getElementById("place-modal");
    const titleEl = document.getElementById("place-title");
    const photoEl = document.getElementById("place-photo");
    const textEl = document.getElementById("place-text");

    function openPlace(key) {
      const place = places[key];
      titleEl.textContent = place.title;
      textEl.textContent = place.text;

      if (place.photo) {
        photoEl.src = place.photo;
        photoEl.alt = place.title;
        photoEl.style.display = "block";
      } else {
        photoEl.style.display = "none";
      }

      modal.classList.add("active");
    }

    function closePlace() {
      modal.classList.remove("active");
    }

    document.querySelectorAll(".pin").forEach(pin => {
      pin.addEventListener("click", () => openPlace(pin.dataset.place));
    });

    document.getElementById("place-close").addEventListener("click", closePlace);

    modal.addEventListener("click", event => {
      if (event.target === modal) closePlace();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closePlace();
    });

    /* MODO AJUSTE: muestra el % donde pinchas sobre el mapa */

    if (location.search.includes("editar")) {
      const coords = document.getElementById("coords");
      const map = document.getElementById("map");
      coords.style.display = "block";
      coords.textContent = "Pincha en el mapa";

      map.addEventListener("click", event => {
        if (event.target.classList.contains("pin")) return;
        const rect = map.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width * 100).toFixed(1);
        const y = ((event.clientY - rect.top) / rect.height * 100).toFixed(1);
        coords.textContent = `left: ${x}%; top: ${y}%;`;
      });
    }
  </script>
</body>
</html>
