<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Día 2 · Sopa de letras</title>
  <link rel="stylesheet" href="dias.css">

  <style>
    /* Una sola columna: cuadrícula arriba, palabras debajo */
    .template-sections {
      grid-template-columns: 1fr;
    }

    /* CUADRÍCULA */

    .wordsearch {
      display: grid;
      width: min(100%, 640px);
      margin: 18px auto 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .letter,
    .blank {
      aspect-ratio: 1;
    }

    .letter {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid rgba(201, 167, 107, 0.55);
      background: rgba(255, 255, 255, 0.45);
      color: var(--dark-red, #4B252A);
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: clamp(10px, 2.6vw, 20px);
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s ease, color .15s ease;
    }

    .letter:hover {
      background: rgba(201, 167, 107, 0.25);
    }

    /* LETRA SUBRAYADA */

    .letter.marked {
      color: var(--burgundy, #762E36);
      background: rgba(118, 46, 54, 0.14);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      text-decoration-color: var(--burgundy, #762E36);
    }

    /* PALABRAS */

    .word-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px 18px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .word-list li {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-style: italic;
      color: var(--green, #18372E);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .word-list li::before {
      content: "✧ ";
      color: var(--gold, #C9A76B);
    }

    /* BOTÓN BORRAR */

    .reset {
      display: block;
      margin: 20px auto 0;
      padding: 9px 16px;
      border: 1px solid var(--gold, #C9A76B);
      background: var(--cream, #F2E9D8);
      color: var(--burgundy, #762E36);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .reset:hover {
      background: var(--burgundy, #762E36);
      color: var(--cream, #F2E9D8);
    }
  </style>
</head>
<body class="day-body day-body--template">
  <main class="day-frame day-template">
    <div class="template-content">

      <header class="template-heading">
        <p class="template-eyebrow">Día 2 · Adviento 2026</p>
        <h1>Sopa de letras</h1>
        <p class="template-intro">Toca las letras para subrayarlas y encuentra todas las palabras.</p>
      </header>

      <div class="template-sections">

        <section class="template-card">
          <h2>Cuadrícula</h2>
          <div class="wordsearch" id="wordsearch" aria-label="Sopa de letras en forma de corazón"></div>
          <button class="reset" id="reset">Borrar subrayados</button>
        </section>

        <section class="template-card">
          <h2>Palabras</h2>
          <p>Estas son las palabras escondidas.</p>
          <ul class="word-list" id="word-list"></ul>
        </section>

      </div>
    </div>
  </main>

  <a href="../index.html" class="back-link">← Volver al calendario</a>

  <script>
    /* CUADRÍCULA: cada línea es una fila. El punto (.) es una casilla vacía. */

    const grid = [
      "..KCDD...OAEA..",
      ".NTUAMR.OMDBDL.",
      "JORXDVSXVGRRADW",
      "BICYIEIASRLAMIA",
      "NVLKVFUTBOLTARA",
      "QAEOAIABFDWILDD",
      "AIRANACNARGSLAG",
      "AAZEVRECZNALSMO",
      ".ICREGALOPLAZM.",
      "..OOTNEIVDAVR..",
      "...IANALLEMA...",
      "....OGOADTA....",
      ".....AINIX.....",
      "......NBF......",
      ".......I......."
    ];

    /* PALABRAS */

    const words = [
      "Madrid",
      "Grancanaria",
      "Bratislava",
      "Navidad",
      "Adviento",
      "Regalo",
      "Cerveza",
      "Llamada",
      "Avión",
      "Fútbol"
    ];

    /* A partir de aquí no hace falta tocar nada */

    const board = document.getElementById("wordsearch");
    const list = document.getElementById("word-list");

    board.style.gridTemplateColumns = `repeat(${grid[0].length}, 1fr)`;

    grid.forEach((row, r) => {
      [...row].forEach((char, c) => {
        if (char === ".") {
          const blank = document.createElement("div");
          blank.className = "blank";
          board.appendChild(blank);
          return;
        }

        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "letter";
        cell.textContent = char;
        cell.setAttribute("aria-label", `Letra ${char}, fila ${r + 1}, columna ${c + 1}`);
        cell.addEventListener("click", () => cell.classList.toggle("marked"));
        board.appendChild(cell);
      });
    });

    words.forEach(word => {
      const li = document.createElement("li");
      li.textContent = word;
      list.appendChild(li);
    });

    document.getElementById("reset").addEventListener("click", () => {
      board.querySelectorAll(".marked").forEach(cell => cell.classList.remove("marked"));
    });
  </script>
</body>
</html>
