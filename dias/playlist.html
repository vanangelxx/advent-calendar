<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Día 22 · Playlist especial para ti</title>
  <link rel="stylesheet" href="dias.css">
</head>
<body class="day-body day-body--template">
  <main class="day-frame day-template">
    <div class="template-content">
      <header class="template-heading">
        <p class="template-eyebrow">Día 22 · Adviento 2026</p>
        <h1>Playlist especial para ti</h1>
        <p class="template-intro">Añade canciones y enlaces para crear la playlist.</p>
      </header>
      <div class="template-sections">
        <section class="template-card">
          <h2>Canciones</h2>
          <p>Escribe el título, artista o enlace de cada canción.</p>
          <ol class="template-list">
            <li><textarea class="template-input" aria-label="Canción 1"></textarea></li>
            <li><textarea class="template-input" aria-label="Canción 2"></textarea></li>
            <li><textarea class="template-input" aria-label="Canción 3"></textarea></li>
            <li><textarea class="template-input" aria-label="Canción 4"></textarea></li>
            <li><textarea class="template-input" aria-label="Canción 5"></textarea></li>
            <li><textarea class="template-input" aria-label="Canción 6"></textarea></li>
            <li><textarea class="template-input" aria-label="Canción 7"></textarea></li>
            <li><textarea class="template-input" aria-label="Canción 8"></textarea></li>
          </ol>
        </section>
        <section class="template-card">
          <h2>Notas</h2>
          <p>Añade aquí cualquier detalle que quieras compartir.</p>
          <textarea class="template-input" aria-label="Notas de la playlist"></textarea>
        </section>
      </div>
    </div>
  </main>
  <a href="../index.html" class="back-link">← Volver al calendario</a>
</body>
</html>
