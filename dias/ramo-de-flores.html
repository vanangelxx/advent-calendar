<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Día 08 · Ramo de flores</title>
  <link rel="stylesheet" href="dias.css">

  <style>
    /* RAMO */

    .bouquet {
      width: min(100%, 460px);
      margin: 10px auto 0;
    }

    .bouquet-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    /* FLORES PULSABLES */

    .flower {
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .flower .shape {
      transform-box: fill-box;
      transform-origin: center;
      transition: filter .2s ease;
    }

    .flower:hover .shape,
    .flower:focus-visible .shape {
      filter: brightness(1.06) drop-shadow(0 3px 5px rgba(118, 46, 54, .3));
    }

    .flower:focus-visible .hit {
      stroke: var(--burgundy, #762E36);
      stroke-width: 2;
      stroke-dasharray: 5 4;
    }

    /* Movimiento al pulsar */
    .flower .shape.wiggle {
      animation: wiggle .6s ease;
    }

    @keyframes wiggle {
      0%   { transform: rotate(0deg); }
      20%  { transform: rotate(-11deg) scale(1.05); }
      45%  { transform: rotate(9deg) scale(1.05); }
      70%  { transform: rotate(-5deg); }
      100% { transform: rotate(0deg); }
    }

    /* Corazón del centro: avisa de que se puede pulsar */
    .hint {
      font-size: 18px;
      fill: #fff;
      stroke: rgba(118, 46, 54, .55);
      stroke-width: 3px;
      paint-order: stroke;
      pointer-events: none;
      transform-box: fill-box;
      transform-origin: center;
      animation: beat 2.4s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.25); }
    }

    @media (prefers-reduced-motion: reduce) {
      .flower .shape.wiggle,
      .hint { animation: none; }
    }

    /* VENTANA AL PULSAR UNA FLOR */

    .flower-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(24, 55, 46, .5);
    }

    .flower-modal.active {
      display: flex;
    }

    .flower-card {
      position: relative;
      width: min(100%, 440px);
      max-height: 90vh;
      overflow-y: auto;
      padding: 34px 28px;
      background: var(--paper, #F8F0E2);
      border: 1px solid var(--gold, #C9A76B);
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, .25);
      animation: appear .3s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .flower-card .ornament {
      color: var(--gold, #C9A76B);
      letter-spacing: 6px;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .flower-card h2 {
      margin: 0 0 14px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 500;
      color: var(--burgundy, #762E36);
    }

    .flower-card p {
      margin: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      line-height: 1.45;
      color: var(--green, #18372E);
    }

    .flower-close {
      position: absolute;
      top: 6px;
      right: 12px;
      border: none;
      background: none;
      font-size: 28px;
      color: var(--burgundy, #762E36);
      cursor: pointer;
    }
  </style>
</head>

  <!-- VENTANA -->

  <a href="../index.html" class="back-link">← Volver al calendario</a>

  <script>
    /* TÍTULO Y MENSAJE DE CADA FLOR */

    const flowers = {
      flor1: { title: "Tulipán coral", text: "Escribe aquí el mensaje de esta flor." },
      flor2: { title: "Tulipán rosa",  text: "Escribe aquí el mensaje de esta flor." },
      flor3: { title: "Lirio blanco",  text: "Escribe aquí el mensaje de esta flor." },
      flor4: { title: "Lirio rosa",    text: "Escribe aquí el mensaje de esta flor." },
      flor5: { title: "Margarita",     text: "Escribe aquí el mensaje de esta flor." },
      flor6: { title: "Flor rosa",     text: "Escribe aquí el mensaje de esta flor." }
    };

    const modal = document.getElementById("flower-modal");
    const titleEl = document.getElementById("flower-title");
    const textEl = document.getElementById("flower-text");

    function openFlower(key) {
      titleEl.textContent = flowers[key].title;
      textEl.textContent = flowers[key].text;
      modal.classList.add("active");
    }

    function closeFlower() {
      modal.classList.remove("active");
    }

    document.querySelectorAll(".flower").forEach(flower => {
      const shape = flower.querySelector(".shape");

      function activate() {
        // Movimiento de la flor
        shape.classList.remove("wiggle");
        void shape.getBoundingClientRect();   // reinicia la animación si se pulsa dos veces seguidas
        shape.classList.add("wiggle");

        // El mensaje aparece cuando la flor ya se ha movido un poco
        setTimeout(() => openFlower(flower.dataset.flower), 350);
      }

      shape.addEventListener("animationend", event => {
        if (event.animationName === "wiggle") shape.classList.remove("wiggle");
      });

      flower.addEventListener("click", activate);
      flower.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activate();
        }
      });
    });

    document.getElementById("flower-close").addEventListener("click", closeFlower);

    modal.addEventListener("click", event => {
      if (event.target === modal) closeFlower();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeFlower();
    });
  </script>
</body>
