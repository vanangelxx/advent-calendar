<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Día 04 · Mis vídeos favoritos</title>
  <link rel="stylesheet" href="dias.css">

  <style>
    /* CONTENEDOR PRINCIPAL THIS OR THAT */
    .tot-container {
      max-width: 680px;
      margin: 24px auto 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* FILA DE CADA PAR DE PALABRAS */
    .choice-row {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      align-items: center;
      padding: 6px 0;
    }

    /* LÍNEA DIVISORIA CENTRAL */
    .divider {
      width: 1px;
      height: 24px;
      background-color: var(--gold, #C9A76B);
      opacity: 0.7;
    }

    /* BOTÓN DE CADA PALABRA */
    .word-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.25rem, 2.8vw, 1.65rem);
      color: var(--burgundy, #762E36);
      padding: 6px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s ease, opacity 0.2s ease;
      position: relative;
    }

    .word-btn:hover {
      transform: scale(1.04);
    }

    /* ESTRELLITA DORADA (A LA IZQUIERDA AL PULSAR) */
    .word-btn::before {
      content: "★";
      color: var(--gold, #C9A76B);
      font-size: 0.9em;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .word-btn.selected {
      font-weight: 700;
    }

    .word-btn.selected::before {
      opacity: 1;
      transform: scale(1);
    }

    /* CORAZÓN (A LA DERECHA AL REVELAR TUS RESPUESTAS) */
    .word-btn.my-choice::after {
      content: "♥";
      color: var(--burgundy, #762E36);
      font-size: 0.9em;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .tot-container.revealed .word-btn.my-choice::after {
      opacity: 1;
      transform: scale(1);
    }

    /* BOTÓN REVELAR */
    .reveal-wrapper {
      margin-top: 32px;
      text-align: center;
    }

    .reveal-button {
      padding: 12px 34px;
      border: 1px solid var(--gold, #C9A76B);
      border-radius: 999px;
      background: var(--paper, #F8F0E2);
      color: var(--burgundy, #762E36);
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      font-style: italic;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
    }

    .reveal-button:hover {
      background: var(--burgundy, #762E36);
      color: var(--cream, #F2E9D8);
      transform: scale(1.03);
    }

    .reveal-button:disabled {
      background: var(--burgundy, #762E36);
      color: var(--cream, #F2E9D8);
      cursor: default;
      transform: none;
    }
  </style>
</head>
<body class="day-body day-body--template">
  <main class="day-frame day-template">
    <div class="template-content">

      <header class="template-heading">
        <p class="template-eyebrow">Día 04 · Adviento 2026</p>
        <h1>Mis vídeos favoritos</h1>
        <p class="template-intro">Elige un número y mira el vídeo en la tele.</p>
      </header>

      <!-- LISTA DE 15 PARES (Añade la clase "my-choice" en tus respuestas) -->
      <div class="tot-container" id="tot-list">

        <div class="choice-row">
          <button class="word-btn my-choice">Café</button>
          <span class="divider"></span>
          <button class="word-btn">Té</button>
        </div>

        <div class="choice-row">
          <button class="word-btn">Verano</button>
          <span class="divider"></span>
          <button class="word-btn my-choice">Invierno</button>
        </div>

        <div class="choice-row">
          <button class="word-btn my-choice">Dulce</button>
          <span class="divider"></span>
          <button class="word-btn">Salado</button>
        </div>

        <div class="choice-row">
          <button class="word-btn">Playa</button>
          <span class="divider"></span>
          <button class="word-btn my-choice">Montaña</button>
        </div>

        <div class="choice-row">
          <button class="word-btn">Madrugar</button>
          <span class="divider"></span>
          <button class="word-btn my-choice">Trasnochar</button>
        </div>

        <div class="choice-row">
          <button class="word-btn my-choice">Libro</button>
          <span class="divider"></span>
          <button class="word-btn">Película</button>
        </div>

        <div class="choice-row">
          <button class="word-btn">Perros</button>
          <span class="divider"></span>
          <button class="word-btn my-choice">Gatos</button>
        </div>

        <div class="choice-row">
          <button class="word-btn my-choice">Manta y sofá</button>
          <span class="divider"></span>
          <button class="word-btn">Salir de fiesta</button>
        </div>

        <div class="choice-row">
          <button class="word-btn">Pizza</button>
          <span class="divider"></span>
          <button class="word-btn my-choice">Sushi</button>
        </div>

        <div class="choice-row">
          <button class="word-btn">Llamada</button>
          <span class="divider"></span>
          <button class="word-btn my-choice">Mensaje</button>
        </div>

        <div class="choice-row">
          <button class="word-btn my-choice">Amanecer</button>
          <span class="divider"></span>
          <button class="word-btn">Atardecer</button>
        </div>

        <div class="choice-row">
          <button class="word-btn">Ciudad</button>
          <span class="divider"></span>
          <button class="word-btn my-choice">Pueblo</button>
        </div>

        <div class="choice-row">
          <button class="word-btn my-choice">Chocolate negro</button>
          <span class="divider"></span>
          <button class="word-btn">Chocolate con leche</button>
        </div>

        <div class="choice-row">
          <button class="word-btn">Improvisar</button>
          <span class="divider"></span>
          <button class="word-btn my-choice">Planificar</button>
        </div>

        <div class="choice-row">
          <button class="word-btn my-choice">Navidad</button>
          <span class="divider"></span>
          <button class="word-btn">Año Nuevo</button>
        </div>

      </div>

      <!-- BOTÓN REVELAR -->
      <div class="reveal-wrapper">
        <button class="reveal-button" id="reveal-btn">Revelar</button>
      </div>

    </div>
  </main>

  <a href="../index.html" class="back-link">← Volver al calendario</a>

  <script>
    const rows = document.querySelectorAll(".choice-row");
    const revealBtn = document.getElementById("reveal-btn");
    const totList = document.getElementById("tot-list");

    // Selección exclusiva por fila (solo una estrellita por cada pareja)
    rows.forEach(row => {
      const buttons = row.querySelectorAll(".word-btn");
      buttons.forEach(btn => {
        btn.addEventListener("click", () => {
          buttons.forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
        });
      });
    });

    // Mostrar corazones en tus respuestas al pulsar Revelar
    revealBtn.addEventListener("click", () => {
      totList.classList.add("revealed");
      revealBtn.textContent = "Mis respuestas ♥";
      revealBtn.disabled = true;
    });
  </script>
</body>
</html>
