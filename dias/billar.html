<style>
:root {
    --cream: #F2E9D8;
    --burgundy: #762E36;
    --dark-red: #4B252A;
    --green: #18372E;
    --gold: #C9A76B;
    --paper: #F8F0E2;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: var(--cream);
    color: var(--dark-red);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "DM Sans", sans-serif;
}

/* PÁGINA (igual que el día 03) */

.magazine {
    position: relative;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 12px 40px rgba(50, 30, 20, 0.15);
}

.magazine::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(118, 46, 54, 0.12);
    pointer-events: none;
    z-index: 20;
}

/* BOLAS (PNG) */

.ball {
    position: absolute;
    z-index: 3;
}

.ball img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.ball-red    { left: 2%;  top: 2%;  width: 16%; height: 24%; }
.ball-yellow { left: 20%; top: 2%;  width: 16%; height: 24%; }
.ball-brown  { left: 4%;  top: 28%; width: 16%; height: 24%; }
.ball-white  { left: 4%;  top: 54%; width: 16%; height: 24%; }

/* TACO (PNG) */

.cue {
    position: absolute;
    left: 7%;
    top: 78%;
    width: 10%;
    height: 27%;
    z-index: 2;
}

.cue img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: top center;
    display: block;
}

/* PORTAPAPELES: solo la imagen, mitad derecha, 45º, doble de tamaño */

.clipboard {
    position: absolute;
    left: 75%;                 /* ← posición horizontal */
    top: 50%;                  /* ← posición vertical */
    width: 60%;                /* ← tamaño */
    aspect-ratio: 3 / 4;       /* ← proporción de tu PNG */
    transform: translate(-50%, -50%) rotate(-20deg);
    z-index: 3;
}

.clipboard img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* TÍTULO Y SUBTÍTULO (independientes, sin girar) */

.title {
    position: absolute;
    left: 50%;                 /* ← mueve el título */
    top: 6%;
    font-family: "Great Vibes", cursive;
    font-size: clamp(34px, 5vw, 66px);
    font-weight: 400;
    line-height: 1.1;
    color: var(--burgundy);
    z-index: 5;
}

.subtitle {
    position: absolute;
    left: 50%;                 /* ← mueve el subtítulo */
    top: 18%;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: clamp(16px, 2.2vw, 28px);
    line-height: 1.1;
    color: var(--green);
    z-index: 5;
}
