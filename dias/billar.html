<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Día 08 · Billar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
    --cream: #F2E9D8;
    --burgundy: #762E36;
    --dark-red: #4B252A;
    --green: #18372E;
    --gold: #C9A76B;
    --paper: #F8F0E2;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: var(--cream);
    color: var(--dark-red);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "DM Sans", sans-serif;
}

/* PÁGINA (igual que el día 03) */

.magazine {
    position: relative;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 12px 40px rgba(50, 30, 20, 0.15);
}

.magazine::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(118, 46, 54, 0.12);
    pointer-events: none;
    z-index: 20;
}

/* BOLAS (PNG) */

.ball {
    position: absolute;
    z-index: 3;
}

.ball img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.ball-red    { left: 2%;  top: 2%;  width: 16%; height: 24%; }
.ball-yellow { left: 20%; top: 2%;  width: 16%; height: 24%; }
.ball-brown  { left: 4%;  top: 28%; width: 16%; height: 24%; }
.ball-white  { left: 4%;  top: 54%; width: 16%; height: 24%; }

/* TACO (PNG) */

.cue {
    position: absolute;
    left: 7%;
    top: 78%;
    width: 10%;
    height: 27%;
    z-index: 2;
}

.cue img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: top center;
    display: block;
}

/* PORTAPAPELES: solo la imagen, mitad derecha, 45º, doble de tamaño */

.clipboard {
    position: absolute;
    left: 75%;                 /* ← posición horizontal */
    top: 50%;                  /* ← posición vertical */
    width: 60%;                /* ← tamaño */
    aspect-ratio: 3 / 4;       /* ← proporción de tu PNG */
    transform: translate(-50%, -50%) rotate(-45deg);
    z-index: 3;
}

.clipboard img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* TÍTULO Y SUBTÍTULO (independientes, sin girar) */

.title {
    position: absolute;
    left: 50%;                 /* ← mueve el título */
    top: 6%;
    font-family: "Great Vibes", cursive;
    font-size: clamp(34px, 5vw, 66px);
    font-weight: 400;
    line-height: 1.1;
    color: var(--burgundy);
    z-index: 5;
}

.subtitle {
    position: absolute;
    left: 50%;                 /* ← mueve el subtítulo */
    top: 18%;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: clamp(16px, 2.2vw, 28px);
    line-height: 1.1;
    color: var(--green);
    z-index: 5;
}

/* MARCADOR (independiente, sin girar) */

.score {
    position: absolute;
    left: 52%;                 /* ← mueve el marcador */
    top: 30%;
    width: 38%;                /* ← ancho del marcador */
    border-collapse: collapse;
    font-family: "DM Sans", sans-serif;
    font-size: clamp(11px, 1.5vw, 18px);
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: #000;
    z-index: 5;
}

.score td {
    padding: 6px 8px;
}

.score .name {
    border-right: 3px solid #000;
    text-align: left;
}

.score .points {
    border-right: 1px solid #000;
    text-align: center;
    width: 17%;
}

/* MÓVIL */

@media (max-width: 600px) {

    .title {
        font-size: clamp(28px, 8vw, 42px);
    }

    .subtitle {
        font-size: clamp(13px, 3.6vw, 18px);
    }

    .score {
        font-size: 9px;
    }

    .score td {
        padding: 3px 4px;
    }
}
</style>

<link rel="stylesheet" href="dias.css">
</head>

<body class="day-body day-body--magazine">

<main class="magazine day-frame">

    <!-- VOLVER AL CALENDARIO -->
    <a href="../index.html" class="back-link">
        ← Volver al calendario
    </a>

    <!-- BOLAS -->
    <div class="ball ball-red">
        <img src="../imagenes/bola-11.png" alt="Bola roja 11">
    </div>

    <div class="ball ball-yellow">
        <img src="../imagenes/bola-6.png" alt="Bola amarilla 6">
    </div>

    <div class="ball ball-brown">
        <img src="../imagenes/bola-7.png" alt="Bola marrón 7">
    </div>

    <div class="ball ball-white">
        <img src="../imagenes/bola-blanca.png" alt="Bola blanca">
    </div>

    <!-- TACO -->
    <div class="cue">
        <img src="../imagenes/taco.png" alt="Taco de billar">
    </div>

    <!-- PORTAPAPELES (solo la imagen) -->
    <div class="clipboard">
        <img src="../imagenes/portapapeles.png" alt="Portapapeles con papel">
    </div>

    <!-- TEXTOS Y MARCADOR (fuera del portapapeles) -->
    <h1 class="title">Título</h1>
    <p class="subtitle">Subtítulo</p>

    <table class="score">
        <tr>
            <td class="name">Alvaro</td>
            <td class="points">12</td>
            <td class="points">5</td>
        </tr>
        <tr>
            <td class="name">Clara</td>
            <td class="points">1</td>
            <td class="points">4</td>
        </tr>
    </table>

</main>

</body>
</html>
