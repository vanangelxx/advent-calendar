<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Día 08 · Billar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
    --cream: #F2E9D8;
    --burgundy: #762E36;
    --dark-red: #4B252A;
    --green: #18372E;
    --gold: #C9A76B;
    --paper: #F8F0E2;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: var(--cream);
    color: var(--dark-red);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "DM Sans", sans-serif;
}

/* PÁGINA (igual que el día 03) */

.magazine {
    position: relative;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 12px 40px rgba(50, 30, 20, 0.15);
}

.magazine::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(118, 46, 54, 0.12);
    pointer-events: none;
    z-index: 20;
}

/* BOLAS (PNG) */

.ball {
    position: absolute;
    z-index: 3;
}

.ball img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* Si todavía no has subido el PNG, se ve un recuadro de ayuda */
.ball.missing {
    border: 1px dashed var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10px;
    color: var(--green);
}

.ball.missing img {
    display: none;
}

.ball-red    { left: 2%;  top: 2%;  width: 16%; height: 24%; }
.ball-yellow { left: 20%; top: 2%;  width: 16%; height: 24%; }
.ball-brown  { left: 4%;  top: 28%; width: 16%; height: 24%; }
.ball-white  { left: 4%;  top: 54%; width: 16%; height: 24%; }

/* TACO */

.cue {
    position: absolute;
    left: 10%;
    top: 80%;
    width: 3.5%;
    height: 25%;
    display: flex;
    flex-direction: column;
    z-index: 2;
}

.cue-tip     { height: 6%; background: #8fd3e8; border: 1.5px solid var(--dark-red); border-radius: 6px 6px 0 0; }
.cue-ferrule { height: 10%; background: #b9c4c8; border: 1.5px solid var(--dark-red); border-top: none; }
.cue-wood    { flex: 1; background: #f0dc8a; border: 1.5px solid var(--dark-red); border-top: none; }

/* TEXTOS */

.title {
    position: absolute;
    left: 46%;
    top: 10%;
    font-family: "Great Vibes", cursive;
    font-size: clamp(38px, 6vw, 80px);
    font-weight: 400;
    line-height: 1.1;
    color: var(--burgundy);
    z-index: 4;
}

.subtitle {
    position: absolute;
    left: 46%;
    top: 27%;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: clamp(18px, 2.4vw, 30px);
    line-height: 1.1;
    color: var(--green);
    z-index: 4;
}

/* PORTAPAPELES */

.clipboard {
    position: absolute;
    left: 45%;
    top: 46%;
    width: 50%;
    height: 48%;
    transform: rotate(-6deg);
    z-index: 3;
}

.board {
    position: absolute;
    inset: 0;
    background-color: var(--green);
    background-image: radial-gradient(rgba(0, 0, 0, .35) 1.4px, transparent 1.6px);
    background-size: 6px 6px;
    border: 3px solid #0f2b22;
    border-radius: 10px;
}

.clip {
    position: absolute;
    left: 28%;
    top: -3%;
    width: 44%;
    height: 9%;
    background: linear-gradient(#cfc8b8, var(--gold));
    border: 2.5px solid #0f2b22;
    border-radius: 6px;
    z-index: 3;
}

.sheet-back {
    position: absolute;
    left: 10%;
    right: 2%;
    top: 9%;
    bottom: 5%;
    background: #ece4d2;
    border: 1.5px solid #0f2b22;
    transform: rotate(2deg);
    z-index: 1;
}

.sheet {
    position: absolute;
    left: 8%;
    right: 8%;
    top: 9%;
    bottom: 6%;
    background: #fffaf0;
    border: 1.5px solid #0f2b22;
    z-index: 2;
    padding: 8% 5% 0;
}

.sheet::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 5%;
    border-top: 2px solid var(--green);
}

/* MARCADOR */

.score {
    width: 100%;
    border-collapse: collapse;
    font-family: "DM Sans", sans-serif;
    font-size: clamp(11px, 1.5vw, 18px);
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--dark-red);
}

.score td {
    padding: 6px 8px;
}

.score .name {
    border-right: 3px solid var(--dark-red);
    text-align: left;
}

.score .points {
    border-right: 1px solid var(--dark-red);
    text-align: center;
    width: 17%;
}

/* MÓVIL */

@media (max-width: 600px) {

    .title {
        font-size: clamp(30px, 9vw, 46px);
    }

    .subtitle {
        font-size: clamp(14px, 4vw, 20px);
    }

    .score {
        font-size: 9px;
    }

    .score td {
        padding: 3px 4px;
    }
}
</style>

<link rel="stylesheet" href="dias.css">
</head>

<body class="day-body day-body--magazine">

<main class="magazine day-frame">

    <!-- VOLVER AL CALENDARIO -->
    <a href="../index.html" class="back-link">
        ← Volver al calendario
    </a>

    <!-- BOLAS: pon aquí tus PNG -->
    <div class="ball ball-red">
        <img src="../imagenes/bola-11.png" alt="Bola roja 11"
             onerror="this.parentElement.classList.add('missing')">
        <span class="ph" style="display:none"></span>
    </div>

    <div class="ball ball-yellow">
        <img src="../imagenes/bola-6.png" alt="Bola amarilla 6"
             onerror="this.parentElement.classList.add('missing')">
    </div>

    <div class="ball ball-brown">
        <img src="../imagenes/bola-7.png" alt="Bola marrón 7"
             onerror="this.parentElement.classList.add('missing')">
    </div>

    <div class="ball ball-white">
        <img src="../imagenes/bola-blanca.png" alt="Bola blanca"
             onerror="this.parentElement.classList.add('missing')">
    </div>

    <!-- TACO -->
    <div class="cue">
        <div class="cue-tip"></div>
        <div class="cue-ferrule"></div>
        <div class="cue-wood"></div>
    </div>

    <!-- TEXTOS -->
    <h1 class="title">Título</h1>
    <p class="subtitle">Subtítulo</p>

    <!-- PORTAPAPELES -->
    <div class="clipboard">
        <div class="board"></div>
        <div class="clip"></div>
        <div class="sheet-back"></div>
        <div class="sheet">
            <table class="score">
                <tr>
                    <td class="name">Alvaro</td>
                    <td class="points">12</td>
                    <td class="points">5</td>
                </tr>
                <tr>
                    <td class="name">Clara</td>
                    <td class="points">1</td>
                    <td class="points">4</td>
                </tr>
            </table>
        </div>
    </div>

</main>

</body>
</html>
