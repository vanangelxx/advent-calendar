
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historias de nuestra vida</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #F2E9D8;
      --burgundy: #762E36;
      --dark-red: #4B252A;
      --green: #18372E;
      --gold: #C9A76B;
      --paper: #F8F0E2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--cream);
      color: var(--dark-red);
      font-family: "DM Sans", sans-serif;
      min-height: 100vh;
    }

    /* ESTRUCTURA GENERAL */

    .page {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      background: var(--cream);
      padding: 0 4%;
    }

    /* TÍTULO */

    .title-area {
      grid-column: 1 / -1;
      text-align: center;
      padding: 35px 20px 15px;
      position: relative;
      z-index: 2;
    }

    .title-area h1 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(55px, 7vw, 100px);
      font-weight: 400;
      line-height: 1.1;
      color: var(--burgundy);
    }

    .subtitle {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--green);
      margin-top: 5px;
    }

    /* DOS MITADES */

    .left,
    .right {
      min-width: 0;
      min-height: calc(100vh - 190px);
      padding: 25px 30px 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* FOTOGRAFÍA GRANDE DE LA IZQUIERDA */

    .left {
      padding-right: 45px;
    }

    .main-photo {
      width: 85%;
      max-width: 440px;
      transform: rotate(-2deg);
    }

    /* FOTOGRAFÍAS DE LA DERECHA */

    .right {
      padding-left: 35px;
    }

    .photo-grid {
      width: 100%;
      max-width: 620px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 25px;
      align-items: center;
    }

    /* TARJETAS INTERACTIVAS */

    .flip-card {
      width: 100%;
      aspect-ratio: 3088 / 2320;
      perspective: 1000px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: block;
      -webkit-tap-highlight-color: transparent;
    }

    .flip-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.75s ease;
    }

    .flip-card.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .flip-front,
    .flip-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 3px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* CARA DE LA FOTOGRAFÍA */

    .flip-front {
      background: var(--burgundy);
      border: 7px solid var(--burgundy);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cream);
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      background: var(--burgundy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
    }

    .photo-placeholder .number {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(22px, 2.5vw, 34px);
      color: var(--gold);
      margin-bottom: 5px;
    }

    .photo-placeholder .hint {
      font-family: "DM Sans", sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.85;
    }

    /* Cuando añadas una fotografía real, utiliza esta clase */

    .photo-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* CARA DEL MENSAJE */

    .flip-back {
      background: var(--dark-red);
      color: var(--cream);
      transform: rotateY(180deg);
      border: 5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      text-align: center;
    }

    .message {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(15px, 1.6vw, 22px);
      line-height: 1.35;
      font-weight: 500;
    }

    .message::before {
      content: "♥";
      display: block;
      color: var(--gold);
      font-size: 20px;
      margin-bottom: 8px;
    }

    /* COMPOSICIÓN ASIMÉTRICA DE LAS FOTOS */

    .photo-grid .flip-card:nth-child(2) {
      transform: translateY(12px) rotate(1deg);
    }

    .photo-grid .flip-card:nth-child(3) {
      transform: translateY(-8px) rotate(-1deg);
    }

    .photo-grid .flip-card:nth-child(4) {
      transform: translateY(10px) rotate(1deg);
    }

    .photo-grid .flip-card:nth-child(5) {
      transform: translateY(-8px) rotate(-1deg);
    }

    .photo-grid .flip-card:nth-child(6) {
      transform: translateY(12px) rotate(1deg);
    }

    /* CORAZÓN DECORATIVO */

    .heart {
      position: absolute;
      top: 165px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--gold);
      font-size: 20px;
      z-index: 3;
    }

    /* VOLVER AL CALENDARIO */

    .back-link {
      position: fixed;
      bottom: 18px;
      left: 22px;
      z-index: 10;
      color: var(--burgundy);
      text-decoration: none;
      font-family: "DM Sans", sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--cream);
      padding: 9px 13px;
      border: 1px solid var(--gold);
    }

    .back-link:hover {
      background: var(--burgundy);
      color: var(--cream);
    }

    /* MÓVILES Y TABLETS */

    @media (max-width: 700px) {

      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        padding: 0 15px 65px;
      }

      .title-area {
        padding: 35px 5px 20px;
      }

      .title-area h1 {
        font-size: 62px;
      }

      .subtitle {
        font-size: 12px;
        letter-spacing: 3px;
      }

      .heart {
        display: none;
      }

      .left,
      .right {
        min-height: auto;
        padding: 25px 10px;
      }

      .main-photo {
        width: 85%;
        max-width: 400px;
      }

      .right {
        padding-top: 30px;
      }

      .photo-grid {
        max-width: 520px;
        gap: 18px 14px;
      }

      .photo-grid .flip-card {
        transform: none;
      }

      .message {
        font-size: 16px;
      }

      .photo-placeholder .number {
        font-size: 24px;
      }

      .photo-placeholder .hint {
        font-size: 8px;
        letter-spacing: 1px;
      }

      .back-link {
        bottom: 10px;
        left: 10px;
        font-size: 10px;
      }
    }

    @media (max-width: 380px) {
      .photo-grid {
        gap: 12px 10px;
      }

      .flip-back {
        padding: 8px;
      }

      .message {
        font-size: 14px;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <!-- TÍTULO DE LA DOBLE PÁGINA -->

    <header class="title-area">
      <h1>Historias de nuestra vida</h1>
      <p class="subtitle">Pequeños recuerdos, grandes momentos</p>
    </header>

    <div class="heart">♥</div>

    <!-- MITAD IZQUIERDA: UNA FOTOGRAFÍA -->

    <section class="left">

      <div class="main-photo">

        <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 1" aria-pressed="false">

          <div class="flip-inner">

            <div class="flip-front">
              <div class="photo-placeholder">
                <span class="number">01</span>
                <span class="hint">Pulsa para descubrir</span>
              </div>
            </div>

            <div class="flip-back">
              <p class="message">
                Hay momentos que parecen pequeños cuando suceden, pero que con el tiempo se convierten en algunos de nuestros recuerdos favoritos.
              </p>
            </div>

          </div>

        </button>

      </div>

    </section>

    <!-- MITAD DERECHA: SEIS FOTOGRAFÍAS -->

    <section class="right">

      <div class="photo-grid">

        <!-- FOTOGRAFÍA 2 -->

        <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 2" aria-pressed="false">
          <div class="flip-inner">
            <div class="flip-front">
              <div class="photo-placeholder">
                <span class="number">02</span>
                <span class="hint">Pulsa para descubrir</span>
              </div>
            </div>
            <div class="flip-back">
              <p class="message">
                Me encanta poder mirar atrás y ver todo lo que hemos vivido juntos.
              </p>
            </div>
          </div>
        </button>

        <!-- FOTOGRAFÍA 3 -->

        <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 3" aria-pressed="false">
          <div class="flip-inner">
            <div class="flip-front">
              <div class="photo-placeholder">
                <span class="number">03</span>
                <span class="hint">Pulsa para descubrir</span>
              </div>
            </div>
            <div class="flip-back">
              <p class="message">
                Contigo, hasta los planes más sencillos terminan siendo especiales.
              </p>
            </div>
          </div>
        </button>

        <!-- FOTOGRAFÍA 4 -->

        <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 4" aria-pressed="false">
          <div class="flip-inner">
            <div class="flip-front">
              <div class="photo-placeholder">
                <span class="number">04</span>
                <span class="hint">Pulsa para descubrir</span>
              </div>
            </div>
            <div class="flip-back">
              <p class="message">
                Gracias por todas las risas, las aventuras y las historias que todavía nos quedan por vivir.
              </p>
            </div>
          </div>
        </button>

        <!-- FOTOGRAFÍA 5 -->

        <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 5" aria-pressed="false">
          <div class="flip-inner">
            <div class="flip-front">
              <div class="photo-placeholder">
                <span class="number">05</span>
                <span class="hint">Pulsa para descubrir</span>
              </div>
            </div>
            <div class="flip-back">
              <p class="message">
                Si pudiera repetir algunos días de mi vida, muchos de ellos serían a tu lado.
              </p>
            </div>
          </div>
        </button>

        <!-- FOTOGRAFÍA 6 -->

        <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 6" aria-pressed="false">
          <div class="flip-inner">
            <div class="flip-front">
              <div class="photo-placeholder">
                <span class="number">06</span>
                <span class="hint">Pulsa para descubrir</span>
              </div>
            </div>
            <div class="flip-back">
              <p class="message">
                Qué suerte haber coincidido y poder construir tantos recuerdos contigo.
              </p>
            </div>
          </div>
        </button>

        <!-- FOTOGRAFÍA 7 -->

        <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 7" aria-pressed="false">
          <div class="flip-inner">
            <div class="flip-front">
              <div class="photo-placeholder">
                <span class="number">07</span>
                <span class="hint">Pulsa para descubrir</span>
              </div>
            </div>
            <div class="flip-back">
              <p class="message">
                Y lo mejor de nuestra historia es que todavía nos quedan muchísimas páginas por escribir.
              </p>
            </div>
          </div>
        </button>

      </div>

    </section>

  </main>

  <!-- VOLVER AL CALENDARIO -->

  <a href="../index.html" class="back-link">
    ← Volver al calendario
  </a>

  <script>
    const photoCards = document.querySelectorAll(".flip-card");

    photoCards.forEach(function(card) {

      card.addEventListener("click", function() {

        card.classList.toggle("flipped");

        const isFlipped = card.classList.contains("flipped");

        card.setAttribute(
          "aria-pressed",
          isFlipped ? "true" : "false"
        );

      });

    });
  </script>

</body>
</html>
