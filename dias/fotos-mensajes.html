<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historias de nuestra vida</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
    --cream: #F2E9D8;
    --burgundy: #762E36;
    --dark-red: #4B252A;
    --green: #18372E;
    --gold: #C9A76B;
    --paper: #F8F0E2;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: var(--cream);
    color: var(--dark-red);
    font-family: "DM Sans", sans-serif;
}

/* PÁGINA DE REVISTA (igual que el resto de días) */

.magazine {
    position: relative;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 12px 40px rgba(50, 30, 20, 0.15);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr;
    column-gap: clamp(24px, 4vw, 60px);
    padding: 0 6% 90px;
}

.magazine::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(118, 46, 54, 0.12);
    pointer-events: none;
    z-index: 20;
}

/* TÍTULO (ocupa las dos páginas) */

.title-area {
    grid-column: 1 / -1;
    text-align: center;
    padding: 45px 10px 10px;
    position: relative;
    z-index: 2;
}

.title-area h1 {
    font-family: "Great Vibes", cursive;
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 400;
    line-height: 1.1;
    color: var(--burgundy);
}

.subtitle {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(12px, 1.4vw, 17px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--green);
    margin-top: 14px;
}

/* PÁGINA IZQUIERDA: foto grande centrada en vertical respecto al collage */

.left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    min-width: 0;
    padding-top: 10px;
    position: relative;
    z-index: 2;
}

.main-photo {
    position: relative;
    flex: none;
    width: 100%;
    aspect-ratio: 4 / 3;
    transform: rotate(-1.5deg);
}

/* PÁGINA DERECHA */

.right {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    min-width: 0;
    padding-top: 10px;
    position: relative;
    z-index: 2;
}

/* COLLAGE: dos columnas. Las fotos son 4:5 (verticales) o 5:4 (horizontales) */

.collage {
    flex: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: clamp(8px, 1.2vw, 14px);
    width: min(100%, 440px);
    margin: 0 auto;
}

.collage-col {
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.2vw, 14px);
    min-width: 0;
}

/* Cada foto tiene su tamaño fijado por el ancho y la proporción, y nunca se encoge */
.vertical,
.horizontal {
    position: relative;
    flex: none;
    width: 100%;
}

.vertical   { aspect-ratio: 4 / 5; }
.horizontal { aspect-ratio: 5 / 4; }

.tilt-1 { transform: rotate(-1.5deg); }
.tilt-2 { transform: rotate(1.2deg); }
.tilt-3 { transform: rotate(-1deg); }
.tilt-4 { transform: rotate(1.8deg); }

/* TEXTOS DE LAS PÁGINAS */

.page-text {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(15px, 1.5vw, 20px);
    line-height: 1.45;
    color: var(--green);
}

/* FOTOS CON GIRO */

.flip-card {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 5px solid #FFFAF0;
    background: #FFFAF0;
    box-shadow: 0 4px 12px rgba(50, 30, 20, 0.25);
    perspective: 1000px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: box-shadow .2s ease;
}

.flip-card:hover {
    box-shadow: 0 6px 18px rgba(50, 30, 20, 0.35);
}

.flip-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.75s ease;
}

.flip-card.flipped .flip-inner {
    transform: rotateY(180deg);
}

.flip-front,
.flip-back {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
}

/* FRENTE: LA FOTO */

.flip-front {
    background: var(--burgundy);
}

.flip-front::after {
    content: "♥";
    position: absolute;
    right: 6px;
    bottom: 4px;
    color: var(--gold);
    font-size: 14px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    pointer-events: none;
}

.photo-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
}

.photo-placeholder img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Si todavía no has subido la foto, se ve el número */
.photo-placeholder .number,
.photo-placeholder .hint {
    display: none;
}

.photo-placeholder.missing img {
    display: none;
}

.photo-placeholder.missing .number {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(20px, 2.4vw, 32px);
    color: var(--gold);
}

.photo-placeholder.missing .hint {
    display: block;
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--cream);
}

/* REVERSO: EL MENSAJE */

.flip-back {
    transform: rotateY(180deg);
    background: var(--dark-red);
    color: var(--cream);
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    text-align: center;
}

.message {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(9px, 1vw, 14px);
    line-height: 1.25;
    font-weight: 500;
}

.message::before {
    content: "♥";
    display: block;
    color: var(--gold);
    font-size: 12px;
    margin-bottom: 3px;
}

/* MÓVIL: una sola columna */

@media (max-width: 700px) {

    .magazine {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        padding: 0 16px 90px;
    }

    .title-area {
        padding: 40px 5px 10px;
    }

    .title-area h1 {
        font-size: clamp(34px, 10vw, 52px);
    }

    .left,
    .right {
        padding-top: 22px;
    }

    .collage {
        width: 100%;
    }

    .message {
        font-size: 9.5px;
    }

    .message::before {
        font-size: 10px;
        margin-bottom: 2px;
    }

    .flip-back {
        padding: 5px;
    }

    .flip-card {
        border-width: 4px;
    }
}
</style>

<link rel="stylesheet" href="dias.css">
</head>

<body class="day-body day-body--magazine">

                            </div>

                <!-- FOTO 4 · vertical 4:5 -->

                        <div class="flip-inner">
                            <div class="flip-front">

                            </div>

                            </div>

            </div>

            <!-- COLUMNA DERECHA: horizontal, vertical, horizontal -->
            <div class="collage-col">

                <!-- FOTO 5 · horizontal 5:4 -->
                <div class="horizontal tilt-4">
                    <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 5" aria-pressed="false">

</main>

<script>
    document.querySelectorAll(".flip-card").forEach(function (card) {
        card.addEventListener("click", function () {
            card.classList.toggle("flipped");
            card.setAttribute("aria-pressed", card.classList.contains("flipped") ? "true" : "false");
        });
    });
</script>
