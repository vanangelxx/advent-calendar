
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historias de nuestra vida</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #F2E9D8;
      --burgundy: #762E36;
      --dark-red: #4B252A;
      --green: #18372E;
      --gold: #C9A76B;
      --paper: #F8F0E2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--cream);
      color: var(--dark-red);
      font-family: "DM Sans", sans-serif;
      min-height: 100vh;
    }

    /* ESTRUCTURA GENERAL */

    .page {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      padding: 0 4%;
      background: var(--cream);
    }

    /* TÍTULO */

    .title-area {
      grid-column: 1 / -1;
      text-align: center;
      padding: 35px 20px 15px;
      position: relative;
      z-index: 2;
    }

    .title-area h1 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(55px, 7vw, 100px);
      font-weight: 400;
      line-height: 1.1;
      color: var(--burgundy);
    }

    .subtitle {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--green);
      margin-top: 5px;
    }

    /* DOS MITADES */

    .left,
    .right {
      min-width: 0;
      min-height: calc(100vh - 190px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 30px 45px;
    }

    /* FOTOGRAFÍA GRANDE DE LA IZQUIERDA */

    .left {
      padding-right: 45px;
    }

    .main-photo {
      width: 85%;
      max-width: 440px;
      transform: rotate(-2deg);
    }

    /* ZONA DE LAS DOS TIRAS */

    .right {
      padding-left: 35px;
      overflow: visible;
    }

    .photo-strips {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(15px, 3vw, 35px);
      padding: 25px 10px;
    }

    /* TIRAS DE PELÍCULA ANALÓGICA */

    .photo-strip {
      width: min(42%, 220px);
      background: #111111;
      padding: 22px 17px 42px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: relative;
      flex-shrink: 0;
      box-shadow:
        4px 8px 15px rgba(0, 0, 0, 0.25),
        inset 0 0 0 1px #333333;
    }

    /* PERFORACIONES DE LA PELÍCULA */

    .photo-strip::before,
    .photo-strip::after {
      content: "";
      position: absolute;
      top: 12px;
      bottom: 12px;
      width: 7px;
      background-image: radial-gradient(
        ellipse,
        var(--cream) 0 2.5px,
        transparent 2.8px
      );
      background-size: 7px 17px;
      background-repeat: repeat-y;
      pointer-events: none;
      z-index: 2;
    }

    .photo-strip::before {
      left: 4px;
    }

    .photo-strip::after {
      right: 4px;
    }

    /* PRIMERA TIRA: MÁS INCLINADA */

    .photo-strip:first-child {
      transform: rotate(-8deg);
      margin-top: 10px;
    }

    /* SEGUNDA TIRA: MENOS INCLINADA */

    .photo-strip:last-child {
      transform: rotate(3deg);
      margin-top: -5px;
    }

    /* TARJETAS INTERACTIVAS */

    .flip-card {
      width: 100%;
      aspect-ratio: 3088 / 2320;
      perspective: 1000px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: block;
      -webkit-tap-highlight-color: transparent;
    }

    /* MARCO NEGRO DE CADA FOTOGRAFÍA */

    .photo-strip .flip-card {
      position: relative;
      z-index: 1;
      border: 3px solid #080808;
      background: #111111;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
    }

    .flip-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.75s ease;
    }

    .flip-card.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .flip-front,
    .flip-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 1px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* FRENTE GRANATE */

    .flip-front {
      background: var(--burgundy);
      border: 4px solid var(--burgundy);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cream);
    }

    .photo-strip .flip-front {
      border: 2px solid #111111;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      background: var(--burgundy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
    }

    .photo-placeholder .number {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(20px, 2vw, 30px);
      color: var(--gold);
      margin-bottom: 4px;
    }

    .photo-placeholder .hint {
      font-family: "DM Sans", sans-serif;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.9;
    }

    .photo-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* REVERSO CON MENSAJE */

    .flip-back {
      background: var(--dark-red);
      color: var(--cream);
      transform: rotateY(180deg);
      border: 4px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
    }

    .photo-strip .flip-back {
      border: 2px solid var(--gold);
    }

    .message {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(13px, 1.3vw, 19px);
      line-height: 1.3;
      font-weight: 500;
    }

    .message::before {
      content: "♥";
      display: block;
      color: var(--gold);
      font-size: 17px;
      margin-bottom: 5px;
    }

    /* FOTOGRAFÍA GRANDE IZQUIERDA */

    .main-photo .flip-card {
      width: 100%;
    }

    /* CORAZÓN DECORATIVO */

    .heart {
      position: absolute;
      top: 165px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--gold);
      font-size: 20px;
      z-index: 3;
    }

    /* VOLVER AL CALENDARIO */

    .back-link {
      position: fixed;
      bottom: 18px;
      left: 22px;
      z-index: 10;
      color: var(--burgundy);
      text-decoration: none;
      font-family: "DM Sans", sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--cream);
      padding: 9px 13px;
      border: 1px solid var(--gold);
    }

    .back-link:hover {
      background: var(--burgundy);
      color: var(--cream);
    }

    /* TABLETS Y MÓVILES */

    @media (max-width: 700px) {

      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        padding: 0 15px 65px;
      }

      .title-area {
        padding: 35px 5px 20px;
      }

      .title-area h1 {
        font-size: 62px;
      }

      .subtitle {
        font-size: 12px;
        letter-spacing: 3px;
      }

      .heart {
        display: none;
      }

      .left,
      .right {
        min-height: auto;
        padding: 25px 10px;
      }

      .main-photo {
        width: 85%;
        max-width: 400px;
      }

      .right {
        padding-top: 35px;
      }

      .photo-strips {
        gap: 22px;
        padding: 25px 5px;
      }

      .photo-strip {
        width: min(43%, 210px);
        padding: 19px 15px 35px;
        gap: 12px;
      }

      .photo-strip:first-child {
        transform: rotate(-6deg);
      }

      .photo-strip:last-child {
        transform: rotate(2deg);
      }

      .message {
        font-size: 14px;
      }

      .photo-placeholder .number {
        font-size: 22px;
      }

      .photo-placeholder .hint {
        font-size: 7px;
      }

      .back-link {
        bottom: 10px;
        left: 10px;
        font-size: 10px;
      }
    }

    /* MÓVILES PEQUEÑOS */

    @media (max-width: 380px) {

      .photo-strips {
        gap: 14px;
      }

      .photo-strip {
        padding: 16px 13px 30px;
        gap: 9px;
      }

      .flip-back {
        padding: 5px;
      }

      .message {
        font-size: 12px;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <!-- TÍTULO -->

    <header class="title-area">
      <h1>Historias de nuestra vida</h1>
      <p class="subtitle">Pequeños recuerdos, grandes momentos</p>
    </header>

    <div class="heart">♥</div>

    <!-- MITAD IZQUIERDA: FOTOGRAFÍA 1 -->

    <section class="left">

      <div class="main-photo">

        <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 1" aria-pressed="false">

          <div class="flip-inner">

            <div class="flip-front">
              <div class="photo-placeholder">
                <span class="number">01</span>
                <span class="hint">Pulsa para descubrir</span>
              </div>
            </div>

            <div class="flip-back">
              <p class="message">
                Hay momentos que parecen pequeños cuando suceden, pero que con el tiempo se convierten en algunos de nuestros recuerdos favoritos.
              </p>
            </div>

          </div>

        </button>

      </div>

    </section>

    <!-- MITAD DERECHA: DOS TIRAS DE FOTOMATÓN -->

    <section class="right">

      <div class="photo-strips">

        <!-- PRIMERA TIRA: FOTOS 2, 4 Y 6 -->

        <div class="photo-strip">

          <!-- FOTO 2 -->

          <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 2" aria-pressed="false">
            <div class="flip-inner">
              <div class="flip-front">
                <div class="photo-placeholder">
                  <span class="number">02</span>
                  <span class="hint">Pulsa para descubrir</span>
                </div>
              </div>
              <div class="flip-back">
                <p class="message">
                  Me encanta poder mirar atrás y ver todo lo que hemos vivido juntos.
                </p>
              </div>
            </div>
          </button>

          <!-- FOTO 4 -->

          <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 4" aria-pressed="false">
            <div class="flip-inner">
              <div class="flip-front">
                <div class="photo-placeholder">
                  <span class="number">04</span>
                  <span class="hint">Pulsa para descubrir</span>
                </div>
              </div>
              <div class="flip-back">
                <p class="message">
                  Gracias por todas las risas, las aventuras y las historias que todavía nos quedan por vivir.
                </p>
              </div>
            </div>
          </button>

          <!-- FOTO 6 -->

          <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 6" aria-pressed="false">
            <div class="flip-inner">
              <div class="flip-front">
                <div class="photo-placeholder">
                  <span class="number">06</span>
                  <span class="hint">Pulsa para descubrir</span>
                </div>
              </div>
              <div class="flip-back">
                <p class="message">
                  Qué suerte haber coincidido y poder construir tantos recuerdos contigo.
                </p>
              </div>
            </div>
          </button>

        </div>

        <!-- SEGUNDA TIRA: FOTOS 3, 5 Y 7 -->

        <div class="photo-strip">

          <!-- FOTO 3 -->

          <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 3" aria-pressed="false">
            <div class="flip-inner">
              <div class="flip-front">
                <div class="photo-placeholder">
                  <span class="number">03</span>
                  <span class="hint">Pulsa para descubrir</span>
                </div>
              </div>
              <div class="flip-back">
                <p class="message">
                  Contigo, hasta los planes más sencillos terminan siendo especiales.
                </p>
              </div>
            </div>
          </button>

          <!-- FOTO 5 -->

          <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 5" aria-pressed="false">
            <div class="flip-inner">
              <div class="flip-front">
                <div class="photo-placeholder">
                  <span class="number">05</span>
                  <span class="hint">Pulsa para descubrir</span>
                </div>
              </div>
              <div class="flip-back">
                <p class="message">
                  Si pudiera repetir algunos días de mi vida, muchos de ellos serían a tu lado.
                </p>
              </div>
            </div>
          </button>

          <!-- FOTO 7 -->

          <button class="flip-card" type="button" aria-label="Descubrir mensaje de la fotografía 7" aria-pressed="false">
            <div class="flip-inner">
              <div class="flip-front">
                <div class="photo-placeholder">
                  <span class="number">07</span>
                  <span class="hint">Pulsa para descubrir</span>
                </div>
              </div>
              <div class="flip-back">
                <p class="message">
                  Y lo mejor de nuestra historia es que todavía nos quedan muchísimas páginas por escribir.
                </p>
              </div>
            </div>
          </button>

        </div>

      </div>

    </section>

  </main>

  <!-- VOLVER AL CALENDARIO -->

  <a href="../index.html" class="back-link">
    ← Volver al calendario
  </a>

  <script>
    const photoCards = document.querySelectorAll(".flip-card");

    photoCards.forEach(function(card) {

      card.addEventListener("click", function() {

        card.classList.toggle("flipped");

        const isFlipped = card.classList.contains("flipped");

        card.setAttribute(
          "aria-pressed",
          isFlipped ? "true" : "false"
        );

      });

    });
  </script>

</body>
</html>
