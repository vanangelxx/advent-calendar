
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Historias de nuestra vida</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

/* =========================
   COLORES
========================= */

:root {
  --cream: #F2E9D8;
  --burgundy: #762E36;
  --dark-red: #4B252A;
  --green: #18372E;
  --gold: #C9A76B;
  --paper: #FFFFFF;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* =========================
   ESTRUCTURA GENERAL
========================= */

body {
  min-height: 100vh;
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
}

.page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto 1fr;
  background: var(--paper);
}

/* =========================
   TITULO PRINCIPAL
========================= */

.title-area {
  grid-column: 1 / -1;
  background: var(--paper);
  text-align: center;
  padding: 22px 20px 8px;
  position: relative;
  z-index: 2;
}

.main-title {
  color: var(--burgundy);
  font-family: 'Great Vibes', cursive;
  font-size: clamp(65px, 8.5vw, 112px);
  font-weight: 400;
  line-height: 0.78;
}

.main-title span {
  display: block;
}

.subtitle {
  color: var(--green);
  font-family: 'DM Sans', sans-serif;
  font-size: 9px;
  letter-spacing: 4px;
  margin-top: 15px;
  text-transform: uppercase;
}

/* =========================
   DOS MITADES
========================= */

.left,
.right {
  min-height: calc(100vh - 190px);
  background: var(--paper);
  position: relative;
  padding: 20px 35px 45px;
  overflow: hidden;
}

.left {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.right {
  display: flex;
  flex-direction: column;
}

/* =========================
   PEQUEÑOS TITULOS
========================= */

.eyebrow {
  color: var(--gold);
  font-family: 'DM Sans', sans-serif;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 15px;
  text-align: center;
}

.section-title {
  color: var(--green);
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-style: italic;
  font-weight: 400;
  text-align: center;
  margin-bottom: 15px;
}

/* =========================
   TARJETAS GIRATORIAS
========================= */

.flip-card {
  display: block;
  width: 100%;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  perspective: 1000px;
  text-align: center;
  color: var(--dark-red);
  -webkit-tap-highlight-color: transparent;
}

.flip-inner {
  display: block;
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.75s ease;
}

.flip-card.flipped .flip-inner {
  transform: rotateY(180deg);
}

.flip-front,
.flip-back {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}

/* CARA DE LA FOTO */

.flip-front {
  background: #F7F2E9;
  border: 1px solid var(--gold);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #A18B70;
}

.photo-symbol {
  color: var(--gold);
  font-size: 32px;
  margin-bottom: 10px;
}

.photo-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.photo-hint {
  margin-top: 9px;
  color: #A18B70;
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  font-style: italic;
}

/* REVERSO CON MENSAJE */

.flip-back {
  transform: rotateY(180deg);
  background: var(--cream);
  border: 1px solid var(--gold);
  outline: 1px dashed rgba(201, 167, 107, 0.65);
  outline-offset: -7px;
  padding: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.message-heart {
  color: var(--burgundy);
  font-size: 19px;
  margin-bottom: 8px;
}

.message-title {
  color: var(--burgundy);
  font-family: 'Great Vibes', cursive;
  font-size: 28px;
  line-height: 1;
  margin-bottom: 9px;
}

.message-text {
  color: var(--dark-red);
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  line-height: 1.3;
}

/* =========================
   FOTO PRINCIPAL IZQUIERDA
========================= */

.main-photo-card {
  width: min(390px, 100%);
  height: 260px;
  margin: 5px auto 0;
}

.main-photo-card .message-title {
  font-size: 35px;
}

.main-photo-card .message-text {
  font-size: 19px;
}

.left-decoration {
  width: 75px;
  height: 1px;
  background: var(--gold);
  margin: 20px auto 12px;
}

.left-caption {
  color: var(--green);
  font-family: 'Great Vibes', cursive;
  font-size: 31px;
  text-align: center;
}

/* =========================
   CORAZON DECORATIVO
========================= */

.heart {
  width: 85px;
  height: 70px;
  margin: 15px auto 0;
  color: var(--burgundy);
}

.heart svg {
  width: 100%;
  height: 100%;
}

.heart path {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* =========================
   GRUPOS DE FOTOS DERECHA
========================= */

.photo-groups {
  display: flex;
  flex-direction: column;
  gap: 13px;
  width: 100%;
}

.photo-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
  align-items: start;
}

.small-photo-card {
  height: 132px;
  width: 100%;
}

/* PRIMERA PAREJA */

.photo-row:nth-child(1) .flip-card:nth-child(2) {
  margin-top: 17px;
}

/* SEGUNDA PAREJA */

.photo-row:nth-child(2) {
  margin-top: 5px;
}

.photo-row:nth-child(2) .flip-card:nth-child(1) {
  margin-top: 15px;
}

/* TERCERA PAREJA */

.photo-row:nth-child(3) {
  margin-top: 3px;
}

.photo-row:nth-child(3) .flip-card:nth-child(2) {
  margin-top: 17px;
}

/* MENSAJES DE FOTOS PEQUEÑAS */

.small-photo-card .flip-back {
  padding: 11px;
}

.small-photo-card .message-title {
  font-size: 25px;
}

.small-photo-card .message-text {
  font-size: 15px;
}

/* =========================
   VOLVER AL CALENDARIO
========================= */

.back-link {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 10;
  color: var(--burgundy);
  text-decoration: none;
  font-size: 10px;
  letter-spacing: 2px;
  background: rgba(242,233,216,0.92);
  padding: 10px 14px;
}

.back-link:hover {
  color: var(--dark-red);
}

/* =========================
   VERSION MOVIL
========================= */

@media (max-width: 700px) {

  .page {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
  }

  .title-area {
    padding: 35px 15px 20px;
  }

  .main-title {
    font-size: clamp(58px, 13vw, 88px);
    line-height: 0.88;
  }

  .subtitle {
    font-size: 8px;
    letter-spacing: 2px;
  }

  .left,
  .right {
    min-height: auto;
    padding: 30px 25px 45px;
    overflow: visible;
  }

  .left {
    border-bottom: 1px solid rgba(201, 167, 107, 0.25);
  }

  .main-photo-card {
    height: 260px;
  }

  .right {
    padding-top: 35px;
  }

  .small-photo-card {
    height: 155px;
  }

  .photo-groups {
    gap: 20px;
  }

  .photo-row {
    gap: 12px;
  }

  .photo-row:nth-child(1) .flip-card:nth-child(2) {
    margin-top: 15px;
  }

  .photo-row:nth-child(2) .flip-card:nth-child(1) {
    margin-top: 15px;
  }

  .photo-row:nth-child(3) .flip-card:nth-child(2) {
    margin-top: 15px;
  }

  .back-link {
    position: relative;
    display: block;
    width: fit-content;
    margin: 20px auto;
    bottom: auto;
    left: auto;
  }
}

@media (max-width: 380px) {

  .left,
  .right {
    padding-left: 17px;
    padding-right: 17px;
  }

  .main-title {
    font-size: 55px;
  }

  .small-photo-card {
    height: 135px;
  }

  .message-text {
    font-size: 14px;
  }
}

/* =========================
   MOVIMIENTO REDUCIDO
========================= */

@media (prefers-reduced-motion: reduce) {
  .flip-inner {
    transition: none;
  }
}

</style>
</head>

<body>

<main class="page">

  <!-- TITULO QUE OCUPA LAS DOS MITADES -->

  <header class="title-area">

    <h1 class="main-title">
      <span>Historias</span>
      <span>de nuestra vida</span>
    </h1>

    <p class="subtitle">
      Un pequeño álbum de nuestros recuerdos
    </p>

  </header>


  <!-- MITAD IZQUIERDA -->

  <section class="left">

    <p class="eyebrow">
      Capítulo uno · Nosotros
    </p>

    <h2 class="section-title">
      Un recuerdo para guardar
    </h2>

    <!-- FOTO 1 -->

    <button class="flip-card main-photo-card" type="button"
      aria-label="Dar la vuelta a la fotografía uno">

      <span class="flip-inner">

        <span class="flip-front">
          <span class="photo-symbol">♡</span>
          <span class="photo-label">Fotografía 01</span>
          <span class="photo-hint">Pulsa para descubrir</span>
        </span>

        <span class="flip-back">
          <span class="message-heart">♡</span>
          <span class="message-title">Nuestro comienzo</span>
          <span class="message-text">
            Hay momentos que parecen pequeños cuando los vivimos,
            pero que con el tiempo se convierten en recuerdos inolvidables.
          </span>
        </span>

      </span>

    </button>

    <!-- CORAZON DECORATIVO -->

    <div class="heart">
      <svg viewBox="0 0 120 110" aria-hidden="true">
        <path d="M60 91
          C45 77 15 61 18 37
          C21 14 49 14 60 37
          C72 13 101 16 103 39
          C105 59 79 78 60 91
          C49 101 38 103 31 96
          C24 89 34 83 42 89
          C49 95 57 101 67 105" />
      </svg>
    </div>

    <div class="left-decoration"></div>

    <p class="left-caption">
      Y todavía nos quedan tantos...
    </p>

  </section>


  <!-- MITAD DERECHA -->

  <section class="right">

    <p class="eyebrow">
      Pequeños instantes · Grandes recuerdos
    </p>

    <h2 class="section-title">
      Un montón de historias
    </h2>

    <div class="photo-groups">

      <!-- FOTOS 2 Y 3 -->

      <div class="photo-row">

        <button class="flip-card small-photo-card" type="button"
          aria-label="Dar la vuelta a la fotografía dos">

          <span class="flip-inner">

            <span class="flip-front">
              <span class="photo-symbol">♡</span>
              <span class="photo-label">Fotografía 02</span>
              <span class="photo-hint">Pulsa para descubrir</span>
            </span>

            <span class="flip-back">
              <span class="message-heart">♡</span>
              <span class="message-title">Contigo</span>
              <span class="message-text">
                Cualquier lugar es especial si lo comparto contigo.
              </span>
            </span>

          </span>
        </button>


        <button class="flip-card small-photo-card" type="button"
          aria-label="Dar la vuelta a la fotografía tres">

          <span class="flip-inner">

            <span class="flip-front">
              <span class="photo-symbol">♡</span>
              <span class="photo-label">Fotografía 03</span>
              <span class="photo-hint">Pulsa para descubrir</span>
            </span>

            <span class="flip-back">
              <span class="message-heart">♡</span>
              <span class="message-title">Sonrisas</span>
              <span class="message-text">
                Me encanta tener mil motivos para reírme contigo.
              </span>
            </span>

          </span>
        </button>

      </div>


      <!-- FOTOS 4 Y 5 -->

      <div class="photo-row">

        <button class="flip-card small-photo-card" type="button"
          aria-label="Dar la vuelta a la fotografía cuatro">

          <span class="flip-inner">

            <span class="flip-front">
              <span class="photo-symbol">♡</span>
              <span class="photo-label">Fotografía 04</span>
              <span class="photo-hint">Pulsa para descubrir</span>
            </span>

            <span class="flip-back">
              <span class="message-heart">♡</span>
              <span class="message-title">Mi favorito</span>
              <span class="message-text">
                Mi parte favorita de muchos días siempre eres tú.
              </span>
            </span>

          </span>
        </button>


        <button class="flip-card small-photo-card" type="button"
          aria-label="Dar la vuelta a la fotografía cinco">

          <span class="flip-inner">

            <span class="flip-front">
              <span class="photo-symbol">♡</span>
              <span class="photo-label">Fotografía 05</span>
              <span class="photo-hint">Pulsa para descubrir</span>
            </span>

            <span class="flip-back">
              <span class="message-heart">♡</span>
              <span class="message-title">Nuestro mundo</span>
              <span class="message-text">
                Me gusta el mundo que construimos cuando estamos juntos.
              </span>
            </span>

          </span>
        </button>

      </div>


      <!-- FOTOS 6 Y 7 -->

      <div class="photo-row">

        <button class="flip-card small-photo-card" type="button"
          aria-label="Dar la vuelta a la fotografía seis">

          <span class="flip-inner">

            <span class="flip-front">
              <span class="photo-symbol">♡</span>
              <span class="photo-label">Fotografía 06</span>
              <span class="photo-hint">Pulsa para descubrir</span>
            </span>

            <span class="flip-back">
              <span class="message-heart">♡</span>
              <span class="message-title">A tu lado</span>
              <span class="message-text">
                Gracias por hacer que tantos momentos sean inolvidables.
              </span>
            </span>

          </span>
        </button>


        <button class="flip-card small-photo-card" type="button"
          aria-label="Dar la vuelta a la fotografía siete">

          <span class="flip-inner">

            <span class="flip-front">
              <span class="photo-symbol">♡</span>
              <span class="photo-label">Fotografía 07</span>
              <span class="photo-hint">Pulsa para descubrir</span>
            </span>

            <span class="flip-back">
              <span class="message-heart">♡</span>
              <span class="message-title">Por muchos más</span>
              <span class="message-text">
                Y lo mejor de nuestra historia es que todavía continúa.
              </span>
            </span>

          </span>
        </button>

      </div>

    </div>

  </section>

</main>


<!-- VOLVER AL CALENDARIO -->

<a href="../index.html" class="back-link">
  ← VOLVER AL CALENDARIO
</a>


<!-- INTERACCION DE LAS FOTOGRAFIAS -->

<script>

const photoCards = document.querySelectorAll(".flip-card");

photoCards.forEach(function(card) {

  card.addEventListener("click", function() {

    card.classList.toggle("flipped");

    const isFlipped = card.classList.contains("flipped");

    card.setAttribute(
      "aria-pressed",
      isFlipped ? "true" : "false"
    );

  });

});

</script>

</body>
</html>
