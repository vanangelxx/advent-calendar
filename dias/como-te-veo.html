
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cómo te veo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
    --cream: #F2E9D8;
    --burgundy: #762E36;
    --dark-red: #4B252A;
    --green: #18372E;
    --gold: #C9A76B;
    --paper: #F8F0E2;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: var(--cream);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

/* PÁGINA */

.magazine {
    width: min(100%, 1100px);
    aspect-ratio: 4 / 3;
    position: relative;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 12px 40px rgba(50, 30, 20, 0.15);
}

.magazine::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(118, 46, 54, 0.12);
    pointer-events: none;
    z-index: 20;
}

/* VOLVER */

.back {
    position: absolute;
    top: 3.5%;
    left: 4%;
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--burgundy);
    text-decoration: none;
    font-family: "DM Sans", sans-serif;
    font-size: clamp(10px, 1.2vw, 13px);
    transition: transform .25s;
}

.back:hover {
    transform: translateX(-4px);
}

.back .arrow {
    font-size: 23px;
    line-height: 1;
}

/* TÍTULO */

.page-title {
    position: absolute;
    top: 4%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-family: "Great Vibes", cursive;
    font-size: clamp(35px, 4.5vw, 55px);
    color: var(--burgundy);
    white-space: nowrap;
}

/* CESTA CENTRAL */

.basket-area {
    position: absolute;
    left: 31%;
    top: 27%;
    width: 38%;
    height: 48%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 3;
}

.basket-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
}

.basket-placeholder {
    display: none;
    width: 85%;
    height: 85%;
    border: 1px dashed var(--gold);
    color: var(--green);
    font-family: "DM Sans", sans-serif;
    font-size: 12px;
    text-align: center;
    place-items: center;
}

/* TEXTO DENTRO DE LA CESTA */

.basket-title {
    position: absolute;
    z-index: 4;
    top: 43%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 75%;
    text-align: center;
    font-family: "Great Vibes", cursive;
    font-size: clamp(27px, 4vw, 48px);
    color: var(--burgundy);
    text-shadow:
        1px 1px 0 var(--paper),
        -1px -1px 0 var(--paper),
        0 2px 5px rgba(248, 240, 226, 0.5);
    pointer-events: none;
}

/* CONECTORES CURVOS */

.connectors {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    overflow: visible;
    pointer-events: none;
}

.connector {
    fill: none;
    stroke: var(--burgundy);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-dasharray: 2 5;
    opacity: .8;
}

.connector.gold {
    stroke: var(--gold);
    stroke-width: 2;
    stroke-dasharray: none;
}

.connector-dot {
    fill: var(--gold);
}

/* OBJETOS */

.object {
    position: absolute;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--green);
    text-align: center;
    font-family: "Cormorant Garamond", serif;
    transition: transform .3s ease;
}

.object:hover {
    transform: scale(1.07) rotate(0deg) !important;
    z-index: 8;
}

.object img {
    width: 100%;
    height: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(3px 5px 4px rgba(0,0,0,.15));
}

.object-name {
    font-family: "DM Sans", sans-serif;
    font-size: clamp(8px, .9vw, 11px);
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--burgundy);
    font-weight: 600;
}

.object-description {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: clamp(11px, 1.3vw, 15px);
    line-height: 1.1;
    max-width: 145px;
    color: var(--green);
}

/* POSICIONES DE LOS SIETE OBJETOS */

/* ALTAVOZ */

.speaker {
    left: 5%;
    top: 19%;
    width: 15%;
    height: 22%;
    transform: rotate(-11deg);
}

/* LAS PALMAS */

.laspalmas {
    right: 5%;
    top: 16%;
    width: 16%;
    height: 23%;
    transform: rotate(9deg);
}

/* REAL MADRID */

.realmadrid {
    left: 4%;
    bottom: 10%;
    width: 16%;
    height: 24%;
    transform: rotate(8deg);
}

/* PLAYSTATION */

.playstation {
    right: 4%;
    bottom: 9%;
    width: 19%;
    height: 21%;
    transform: rotate(-8deg);
}

/* CERVEZA */

.beer {
    left: 18%;
    top: 45%;
    width: 11%;
    height: 22%;
    transform: rotate(-10deg);
}

/* SUDADERA */

.hoodie {
    right: 17%;
    top: 45%;
    width: 14%;
    height: 22%;
    transform: rotate(10deg);
}

/* NBA */

.nba {
    left: 43%;
    bottom: 3%;
    width: 14%;
    height: 19%;
    transform: rotate(4deg);
}

/* DETALLES DECORATIVOS */

.star {
    position: absolute;
    color: var(--gold);
    z-index: 2;
    font-size: clamp(14px, 2vw, 23px);
}

.star-1 { top: 18%; left: 27%; }
.star-2 { top: 26%; right: 27%; }
.star-3 { bottom: 27%; left: 26%; }
.star-4 { bottom: 22%; right: 27%; }
.star-5 { top: 52%; left: 32%; }

/* VENTANA AL PULSAR UN OBJETO */

.explanation {
    position: absolute;
    inset: 0;
    z-index: 15;
    background: rgba(24, 55, 46, .42);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.explanation.active {
    display: flex;
}

.explanation-card {
    position: relative;
    width: min(75%, 420px);
    padding: 35px 30px;
    background: var(--paper);
    border: 1px solid var(--gold);
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,.2);
    animation: appear .3s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.explanation-card h2 {
    font-family: "Great Vibes", cursive;
    font-size: 38px;
    font-weight: 400;
    color: var(--burgundy);
    margin-bottom: 12px;
}

.explanation-card p {
    font-family: "Cormorant Garamond", serif;
    font-size: 21px;
    line-height: 1.4;
    color: var(--green);
}

.close {
    position: absolute;
    top: 8px;
    right: 13px;
    background: none;
    border: none;
    font-size: 25px;
    color: var(--burgundy);
    cursor: pointer;
}

/* MÓVIL */

@media (max-width: 600px) {
    body {
        padding: 8px;
    }

    .magazine {
        width: 100%;
        aspect-ratio: 4 / 3;
    }

    .page-title {
        top: 5%;
        font-size: clamp(29px, 7vw, 39px);
    }

    .back {
        top: 3%;
        left: 3%;
        font-size: 8px;
        gap: 3px;
    }

    .back .arrow {
        font-size: 17px;
    }

    .basket-area {
        left: 29%;
        top: 30%;
        width: 42%;
        height: 43%;
    }

    .basket-title {
        font-size: clamp(22px, 5vw, 30px);
    }

    .speaker {
        left: 3%;
        top: 20%;
        width: 17%;
        height: 19%;
    }

    .laspalmas {
        right: 3%;
        top: 18%;
        width: 18%;
        height: 20%;
    }

    .realmadrid {
        left: 2%;
        bottom: 10%;
        width: 18%;
        height: 21%;
    }

    .playstation {
        right: 2%;
        bottom: 9%;
        width: 20%;
        height: 18%;
    }

    .beer {
        left: 16%;
        top: 46%;
        width: 12%;
        height: 19%;
    }

    .hoodie {
        right: 15%;
        top: 46%;
        width: 15%;
        height: 19%;
    }

    .nba {
        left: 41%;
        bottom: 2%;
        width: 16%;
        height: 16%;
    }

    .object-description {
        font-size: 9px;
        max-width: 75px;
    }

    .object-name {
        font-size: 7px;
    }

    .explanation-card {
        width: 90%;
        padding: 25px 20px;
    }

    .explanation-card h2 {
        font-size: 32px;
    }

    .explanation-card p {
        font-size: 18px;
    }

    .connector {
        stroke-width: 1.5;
    }
}
</style>
</head>

<body>

<main class="magazine">

    <!-- VOLVER AL CALENDARIO -->
    <a class="back" href="../index.html">
        <span class="arrow">←</span>
        <span>Volver al calendario</span>
    </a>

    <!-- TÍTULO SUPERIOR -->
    <h1 class="page-title">Un poquito de todo lo que eres...</h1>

    <!-- CONECTORES CURVOS: SE DIBUJAN DETRÁS DE LOS OBJETOS -->
    <svg class="connectors" viewBox="0 0 1100 825" preserveAspectRatio="none">

        <!-- ALTAVOZ -->
        <path class="connector"
            d="M 170 245 C 205 220, 220 270, 275 290 S 315 315, 350 340"/>
        <circle class="connector-dot" cx="350" cy="340" r="3"/>

        <!-- LAS PALMAS -->
        <path class="connector gold"
            d="M 925 230 C 880 210, 900 270, 835 285 S 800 310, 760 340"/>
        <circle class="connector-dot" cx="760" cy="340" r="3"/>

        <!-- REAL MADRID -->
        <path class="connector"
            d="M 170 650 C 210 675, 230 620, 280 590 S 310 560, 350 535"/>
        <circle class="connector-dot" cx="350" cy="535" r="3"/>

        <!-- PLAYSTATION -->
        <path class="connector gold"
            d="M 920 650 C 875 675, 870 620, 820 590 S 790 565, 755 535"/>
        <circle class="connector-dot" cx="755" cy="535" r="3"/>

        <!-- CERVEZA -->
        <path class="connector"
            d="M 285 470 C 310 450, 285 420, 330 405 S 360 390, 385 380"/>
        <circle class="connector-dot" cx="385" cy="380" r="3"/>

        <!-- SUDADERA -->
        <path class="connector gold"
            d="M 815 470 C 785 450, 810 420, 770 405 S 745 390, 715 380"/>
        <circle class="connector-dot" cx="715" cy="380" r="3"/>

        <!-- NBA -->
        <path class="connector"
            d="M 550 690 C 520 660, 570 645, 550 610 S 550 585, 550 565"/>
        <circle class="connector-dot" cx="550" cy="565" r="3"/>

    </svg>

    <!-- CESTA CENTRAL -->
    <div class="basket-area">

        <img
            class="basket-image"
            src="../imagenes/cesta.png"
            alt="Cesta de la compra"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
        >

        <div class="basket-placeholder">
            AQUÍ VA TU PNG<br>DE LA CESTA
        </div>

        <!-- TÍTULO DENTRO DE LA CESTA -->
        <h2 class="basket-title">Cómo te veo</h2>

    </div>

    <!-- ALTAVOZ -->
    <button class="object speaker"
        onclick="showExplanation('Altavoz de música')">

        <img src="../imagenes/altavoz.png"
            alt="Altavoz"
            onerror="this.style.display='none';">

        <span class="object-name">Música</span>
        <span class="object-description">
            Aquí irá lo que representa para ti
        </span>
    </button>

    <!-- LAS PALMAS -->
    <button class="object laspalmas"
        onclick="showExplanation('Camiseta de la UD Las Palmas')">

        <img src="../imagenes/las-palmas.png"
            alt="Camiseta de la UD Las Palmas"
            onerror="this.style.display='none';">

        <span class="object-name">UD Las Palmas</span>
        <span class="object-description">
            Aquí irá tu explicación
        </span>
    </button>

    <!-- REAL MADRID -->
    <button class="object realmadrid"
        onclick="showExplanation('Camiseta del Real Madrid')">

        <img src="../imagenes/real-madrid.png"
            alt="Camiseta del Real Madrid"
            onerror="this.style.display='none';">

        <span class="object-name">Real Madrid</span>
        <span class="object-description">
            Aquí irá tu explicación
        </span>
    </button>

    <!-- PLAYSTATION -->
    <button class="object playstation"
        onclick="showExplanation('PlayStation')">

        <img src="../imagenes/playstation.png"
            alt="PlayStation"
            onerror="this.style.display='none';">

        <span class="object-name">PlayStation</span>
        <span class="object-description">
            Aquí irá tu explicación
        </span>
    </button>

    <!-- CERVEZA -->
    <button class="object beer"
        onclick="showExplanation('Cerveza')">

        <img src="../imagenes/cerveza.png"
            alt="Cerveza"
            onerror="this.style.display='none';">

        <span class="object-name">Cerveza</span>
        <span class="object-description">
            Aquí irá tu explicación
        </span>
    </button>

    <!-- SUDADERA -->
    <button class="object hoodie"
        onclick="showExplanation('Sudadera')">

        <img src="../imagenes/sudadera.png"
            alt="Sudadera"
            onerror="this.style.display='none';">

        <span class="object-name">Sudadera</span>
        <span class="object-description">
            Aquí irá tu explicación
        </span>
    </button>

    <!-- NBA -->
    <button class="object nba"
        onclick="showExplanation('NBA')">

        <img src="../imagenes/nba.png"
            alt="Símbolo NBA"
            onerror="this.style.display='none';">

        <span class="object-name">NBA</span>
        <span class="object-description">
            Aquí irá tu explicación
        </span>
    </button>

    <!-- DETALLES DECORATIVOS -->
    <span class="star star-1">✧</span>
    <span class="star star-2">✳</span>
    <span class="star star-3">✧</span>
    <span class="star star-4">✳</span>
    <span class="star star-5">·</span>

    <!-- VENTANA AL PULSAR LOS OBJETOS -->
    <div class="explanation" id="explanation"
        onclick="closeExplanation(event)">

        <div class="explanation-card">

            <button class="close"
                onclick="hideExplanation()">×</button>

            <h2 id="explanation-title"></h2>
            <p id="explanation-text"></p>

        </div>
    </div>

</main>

<script>

/* CAMBIA AQUÍ LOS MENSAJES QUE APARECEN AL PULSAR */

const explanations = {

    "Altavoz de música":
        "Aquí escribe por qué has elegido la música para describirle.",

    "Camiseta de la UD Las Palmas":
        "Aquí escribe qué representa este equipo para él.",

    "Camiseta del Real Madrid":
        "Aquí escribe qué significa el Real Madrid para él.",

    "PlayStation":
        "Aquí escribe por qué has elegido la PlayStation.",

    "Cerveza":
        "Aquí escribe qué representa este objeto para él.",

    "Sudadera":
        "Aquí escribe por qué has elegido esta sudadera.",

    "NBA":
        "Aquí escribe qué representa el baloncesto para él."

};

function showExplanation(object) {

    document.getElementById("explanation-title").textContent = object;

    document.getElementById("explanation-text").textContent =
        explanations[object];

    document.getElementById("explanation").classList.add("active");
}

function hideExplanation() {

    document.getElementById("explanation").classList.remove("active");
}

function closeExplanation(event) {

    if (event.target.id === "explanation") {
        hideExplanation();
    }
}

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        hideExplanation();
    }

});

</script>

</body>
</html>
