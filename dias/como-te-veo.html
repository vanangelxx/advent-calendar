
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cómo te veo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
    --cream: #F2E9D8;
    --burgundy: #762E36;
    --dark-red: #4B252A;
    --green: #18372E;
    --gold: #C9A76B;
    --paper: #F8F0E2;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    color: var(--green);
}

/* PÁGINA DE REVISTA */

.magazine {
    width: min(100%, 1100px);
    aspect-ratio: 4 / 3;
    position: relative;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 12px 40px rgba(50, 30, 20, 0.16);
}

/* TEXTURA DECORATIVA */

.magazine::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid rgba(118, 46, 54, 0.15);
    pointer-events: none;
    z-index: 10;
}

/* VOLVER AL CALENDARIO */

.back {
    position: absolute;
    top: 3.5%;
    left: 3.5%;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--burgundy);
    text-decoration: none;
    font-family: "DM Sans", sans-serif;
    font-size: clamp(10px, 1.2vw, 13px);
    transition: transform 0.25s ease;
}

.back:hover {
    transform: translateX(-5px);
}

.back span:first-child {
    font-size: 23px;
    line-height: 1;
}

/* TÍTULO */

.page-title {
    position: absolute;
    z-index: 5;
    top: 9%;
    left: 50%;
    transform: translateX(-50%);
    width: 75%;
    text-align: center;
    color: var(--burgundy);
    font-family: "Great Vibes", cursive;
    font-size: clamp(35px, 5.3vw, 65px);
    font-weight: 400;
}

/* CESTA CENTRAL */

.basket-area {
    position: absolute;
    width: 38%;
    height: 48%;
    left: 31%;
    top: 29%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
}

.basket-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
}

/* HUECOS DE IMÁGENES */

.placeholder {
    display: none;
    width: 100%;
    height: 100%;
    border: 1px dashed rgba(118, 46, 54, 0.55);
    border-radius: 8px;
    color: var(--burgundy);
    background: rgba(201, 167, 107, 0.08);
    font-family: "DM Sans", sans-serif;
    font-size: 11px;
    text-align: center;
    place-items: center;
    padding: 8px;
}

.basket-placeholder {
    display: grid;
    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--green);
}

.basket-image:not([src]),
.basket-image[src=""] {
    display: none;
}

/* OBJETOS FLOTANTES */

.object {
    position: absolute;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 5px;
    transition: transform 0.3s ease;
}

.object:hover {
    transform: scale(1.09) rotate(0deg) !important;
    z-index: 8;
}

.object img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(3px 7px 5px rgba(0,0,0,0.15));
}

.object .placeholder {
    height: 100%;
}

/* POSICIONES INDIVIDUALES */

.speaker {
    width: 16%;
    height: 21%;
    top: 23%;
    left: 8%;
    transform: rotate(-12deg);
}

.laspalmas {
    width: 17%;
    height: 22%;
    top: 17%;
    right: 9%;
    transform: rotate(10deg);
}

.realmadrid {
    width: 16%;
    height: 22%;
    bottom: 13%;
    left: 7%;
    transform: rotate(8deg);
}

.playstation {
    width: 19%;
    height: 18%;
    bottom: 10%;
    right: 7%;
    transform: rotate(-9deg);
}

.beer {
    width: 10%;
    height: 20%;
    top: 45%;
    left: 5%;
    transform: rotate(-14deg);
}

.hoodie {
    width: 17%;
    height: 20%;
    top: 46%;
    right: 5%;
    transform: rotate(12deg);
}

.nba {
    width: 12%;
    height: 18%;
    bottom: 4%;
    left: 43%;
    transform: rotate(5deg);
}

/* PEQUEÑOS DETALLES */

.decoration {
    position: absolute;
    color: var(--gold);
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(16px, 2vw, 25px);
    z-index: 1;
}

.star-one {
    top: 23%;
    left: 42%;
}

.star-two {
    top: 55%;
    right: 29%;
}

.star-three {
    bottom: 17%;
    right: 38%;
}

.small-note {
    position: absolute;
    bottom: 3%;
    right: 4%;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: var(--burgundy);
    font-size: clamp(10px, 1.2vw, 14px);
    opacity: 0.75;
}

/* VENTANA DE EXPLICACIÓN */

.explanation {
    position: absolute;
    inset: 0;
    z-index: 15;
    background: rgba(24, 55, 46, 0.38);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.explanation.active {
    display: flex;
}

.explanation-card {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--gold);
    width: min(75%, 420px);
    padding: 35px 30px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.2);
    animation: appear 0.3s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.explanation-card h2 {
    font-family: "Great Vibes", cursive;
    color: var(--burgundy);
    font-size: 38px;
    font-weight: 400;
    margin-bottom: 15px;
}

.explanation-card p {
    font-family: "Cormorant Garamond", serif;
    font-size: 21px;
    line-height: 1.45;
    color: var(--green);
}

.close {
    position: absolute;
    top: 10px;
    right: 14px;
    border: none;
    background: none;
    color: var(--burgundy);
    font-size: 25px;
    cursor: pointer;
}

/* MÓVIL */

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    .magazine {
        width: 100%;
        aspect-ratio: 4 / 3;
    }

    .page-title {
        top: 10%;
        font-size: clamp(30px, 8vw, 43px);
    }

    .back {
        top: 3%;
        left: 3%;
        font-size: 9px;
        gap: 4px;
    }

    .back span:first-child {
        font-size: 18px;
    }

    .basket-area {
        width: 42%;
        height: 43%;
        left: 29%;
        top: 32%;
    }

    .speaker {
        width: 18%;
        height: 18%;
        top: 24%;
        left: 5%;
    }

    .laspalmas {
        width: 19%;
        height: 19%;
        top: 19%;
        right: 4%;
    }

    .realmadrid {
        width: 18%;
        height: 19%;
        bottom: 14%;
        left: 4%;
    }

    .playstation {
        width: 20%;
        height: 17%;
        bottom: 12%;
        right: 3%;
    }

    .beer {
        width: 12%;
        height: 18%;
        top: 47%;
        left: 2%;
    }

    .hoodie {
        width: 19%;
        height: 18%;
        top: 48%;
        right: 2%;
    }

    .nba {
        width: 14%;
        height: 15%;
        bottom: 3%;
        left: 42%;
    }

    .explanation-card {
        width: 90%;
        padding: 25px 20px;
    }

    .explanation-card h2 {
        font-size: 32px;
    }

    .explanation-card p {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<main class="magazine">

    <a class="back" href="../index.html">
        <span>←</span>
        <span>Volver al calendario</span>
    </a>

    <h1 class="page-title">Cómo te veo</h1>

    <!-- CESTA CENTRAL: CAMBIA cesta.png POR TU IMAGEN -->
    <div class="basket-area">
        <img
            class="basket-image"
            src="../imagenes/cesta.png"
            alt="Nuestra cesta"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
        >
        <div class="placeholder basket-placeholder">
            AQUÍ VA TU PNG<br>DE LA CESTA
        </div>
    </div>

    <!-- OBJETO 1: ALTAVOZ -->
    <button class="object speaker"
        onclick="showExplanation('Altavoz de música')"
        aria-label="Altavoz de música">
        <img src="../imagenes/altavoz.png" alt="Altavoz"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
        <span class="placeholder">PNG<br>ALTAVOZ</span>
    </button>

    <!-- OBJETO 2: UD LAS PALMAS -->
    <button class="object laspalmas"
        onclick="showExplanation('Camiseta de la UD Las Palmas')"
        aria-label="Camiseta de la UD Las Palmas">
        <img src="../imagenes/las-palmas.png" alt="Camiseta UD Las Palmas"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
        <span class="placeholder">PNG<br>LAS PALMAS</span>
    </button>

    <!-- OBJETO 3: REAL MADRID -->
    <button class="object realmadrid"
        onclick="showExplanation('Camiseta del Real Madrid')"
        aria-label="Camiseta del Real Madrid">
        <img src="../imagenes/real-madrid.png" alt="Camiseta Real Madrid"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
        <span class="placeholder">PNG<br>REAL MADRID</span>
    </button>

    <!-- OBJETO 4: PLAYSTATION -->
    <button class="object playstation"
        onclick="showExplanation('PlayStation')"
        aria-label="PlayStation">
        <img src="../imagenes/playstation.png" alt="PlayStation"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
        <span class="placeholder">PNG<br>PLAYSTATION</span>
    </button>

    <!-- OBJETO 5: CERVEZA -->
    <button class="object beer"
        onclick="showExplanation('Cerveza')"
        aria-label="Cerveza">
        <img src="../imagenes/cerveza.png" alt="Cerveza"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
        <span class="placeholder">PNG<br>CERVEZA</span>
    </button>

    <!-- OBJETO 6: SUDADERA -->
    <button class="object hoodie"
        onclick="showExplanation('Sudadera')"
        aria-label="Sudadera">
        <img src="../imagenes/sudadera.png" alt="Sudadera"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
        <span class="placeholder">PNG<br>SUDADERA</span>
    </button>

    <!-- OBJETO 7: NBA -->
    <button class="object nba"
        onclick="showExplanation('NBA')"
        aria-label="Símbolo NBA">
        <img src="../imagenes/nba.png" alt="Símbolo NBA"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
        <span class="placeholder">PNG<br>NBA</span>
    </button>

    <!-- DETALLES DECORATIVOS -->
    <span class="decoration star-one">✳</span>
    <span class="decoration star-two">✧</span>
    <span class="decoration star-three">✳</span>

    <p class="small-note">Un poquito de todo lo que eres...</p>

    <!-- VENTANA DE EXPLICACIÓN -->
    <div class="explanation" id="explanation"
        onclick="closeExplanation(event)">
        <div class="explanation-card">
            <button class="close" onclick="hideExplanation()">×</button>
            <h2 id="explanation-title">Título</h2>
            <p id="explanation-text"></p>
        </div>
    </div>

</main>

<script>
/* 
   AQUÍ PUEDES CAMBIAR LOS MENSAJES.
   Sustituye cada texto provisional por el significado
   que quieras darle a cada objeto.
*/

const explanations = {
    "Altavoz de música":
        "Aquí irá lo que representa la música para mí cuando pienso en ti.",

    "Camiseta de la UD Las Palmas":
        "Aquí irá por qué este equipo forma parte de ti.",

    "Camiseta del Real Madrid":
        "Aquí irá lo que representa el Real Madrid para ti.",

    "PlayStation":
        "Aquí irá lo que representa tu lado más gamer.",

    "Cerveza":
        "Aquí irá lo que representa este pequeño placer.",

    "Sudadera":
        "Aquí irá por qué he elegido esta prenda para describirte.",

    "NBA":
        "Aquí irá lo que representa tu pasión por el baloncesto."
};

function showExplanation(object) {
    document.getElementById("explanation-title").textContent = object;
    document.getElementById("explanation-text").textContent =
        explanations[object];

    document.getElementById("explanation").classList.add("active");
}

function hideExplanation() {
    document.getElementById("explanation").classList.remove("active");
}

function closeExplanation(event) {
    if (event.target.id === "explanation") {
        hideExplanation();
    }
}

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        hideExplanation();
    }
});
</script>

</body>
</html>
