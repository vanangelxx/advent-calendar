
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cómo te veo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
    --cream: #F2E9D8;
    --burgundy: #762E36;
    --dark-red: #4B252A;
    --green: #18372E;
    --gold: #C9A76B;
    --paper: #F8F0E2;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: var(--cream);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

/* PÁGINA */

.magazine {
    width: min(100%, 1100px);
    aspect-ratio: 4 / 3;
    position: relative;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 12px 40px rgba(50, 30, 20, 0.15);
}

.magazine::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(118, 46, 54, 0.12);
    pointer-events: none;
    z-index: 20;
}

/* VOLVER AL CALENDARIO */

.back {
    position: absolute;
    top: 3.5%;
    left: 4%;
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--burgundy);
    text-decoration: none;
    font-family: "DM Sans", sans-serif;
    font-size: clamp(10px, 1.2vw, 13px);
    transition: transform .25s;
}

.back:hover {
    transform: translateX(-4px);
}

.back .arrow {
    font-size: 23px;
    line-height: 1;
}

/* CESTA CENTRAL */

.basket-area {
    position: absolute;
    left: 31%;
    top: 24%;
    width: 38%;
    height: 53%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 3;
}

.basket-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
}

.basket-placeholder {
    display: none;
    width: 85%;
    height: 85%;
    border: 1px dashed var(--gold);
    color: var(--green);
    font-family: "DM Sans", sans-serif;
    font-size: 12px;
    text-align: center;
    place-items: center;
}

/* TEXTO DENTRO DE LA CESTA */

.basket-title {
    position: absolute;
    z-index: 4;
    top: 43%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 75%;
    text-align: center;
    font-family: "Great Vibes", cursive;
    font-size: clamp(25px, 3.5vw, 43px);
    line-height: 1.15;
    color: var(--burgundy);
    text-shadow:
        1px 1px 0 var(--paper),
        -1px -1px 0 var(--paper),
        0 2px 5px rgba(248, 240, 226, 0.5);
    pointer-events: none;
}

/* OBJETOS FLOTANTES */

.object {
    position: absolute;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--green);
    text-align: center;
    font-family: "Cormorant Garamond", serif;
    transition: transform .3s ease;
}

.object:hover {
    transform: scale(1.08) rotate(0deg) !important;
    z-index: 8;
}

.object img {
    width: 100%;
    height: 78%;
    object-fit: contain;
    filter: drop-shadow(3px 5px 4px rgba(0,0,0,.15));
}

.object-name {
    font-family: "DM Sans", sans-serif;
    font-size: clamp(8px, .9vw, 11px);
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--burgundy);
    font-weight: 600;
}

.object-description {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: clamp(11px, 1.2vw, 14px);
    line-height: 1.1;
    max-width: 145px;
    color: var(--green);
}

/* POSICIONES DE LOS NUEVE OBJETOS */

/* 1. ALTAVOZ */

.speaker {
    left: 5%;
    top: 16%;
    width: 15%;
    height: 23%;
    transform: rotate(-11deg);
}

/* 2. LAS PALMAS */

.laspalmas {
    right: 5%;
    top: 14%;
    width: 16%;
    height: 23%;
    transform: rotate(9deg);
}

/* 3. REAL MADRID */

.realmadrid {
    left: 4%;
    bottom: 7%;
    width: 16%;
    height: 24%;
    transform: rotate(8deg);
}

/* 4. PLAYSTATION */

.playstation {
    right: 4%;
    bottom: 7%;
    width: 18%;
    height: 22%;
    transform: rotate(-8deg);
}

/* 5. CERVEZA */

.beer {
    left: 17%;
    top: 43%;
    width: 11%;
    height: 22%;
    transform: rotate(-10deg);
}

/* 6. SUDADERA */

.hoodie {
    right: 16%;
    top: 43%;
    width: 14%;
    height: 22%;
    transform: rotate(10deg);
}

/* 7. NBA */

.nba {
    left: 43%;
    bottom: 2%;
    width: 14%;
    height: 18%;
    transform: rotate(4deg);
}

/* 8. OBJETO NUEVO */

.extra-one {
    left: 22%;
    top: 15%;
    width: 12%;
    height: 18%;
    transform: rotate(12deg);
}

/* 9. OBJETO NUEVO */

.extra-two {
    right: 22%;
    bottom: 8%;
    width: 12%;
    height: 18%;
    transform: rotate(-12deg);
}

/* DETALLES DECORATIVOS */

.star {
    position: absolute;
    color: var(--gold);
    z-index: 2;
    font-size: clamp(14px, 2vw, 23px);
    pointer-events: none;
}

.star-1 { top: 18%; left: 39%; }
.star-2 { top: 29%; right: 29%; }
.star-3 { bottom: 28%; left: 27%; }
.star-4 { bottom: 25%; right: 29%; }
.star-5 { top: 55%; left: 29%; }
.star-6 { top: 12%; right: 39%; }

/* VENTANA AL PULSAR UN OBJETO */

.explanation {
    position: absolute;
    inset: 0;
    z-index: 15;
    background: rgba(24, 55, 46, .42);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.explanation.active {
    display: flex;
}

.explanation-card {
    position: relative;
    width: min(75%, 420px);
    padding: 35px 30px;
    background: var(--paper);
    border: 1px solid var(--gold);
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,.2);
    animation: appear .3s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.explanation-card h2 {
    font-family: "Great Vibes", cursive;
    font-size: 38px;
    font-weight: 400;
    color: var(--burgundy);
    margin-bottom: 12px;
}

.explanation-card p {
    font-family: "Cormorant Garamond", serif;
    font-size: 21px;
    line-height: 1.4;
    color: var(--green);
}

.close {
    position: absolute;
    top: 8px;
    right: 13px;
    background: none;
    border: none;
    font-size: 25px;
    color: var(--burgundy);
    cursor: pointer;
}

/* MÓVIL */

@media (max-width: 600px) {
    body {
        padding: 8px;
    }

    .magazine {
        width: 100%;
        aspect-ratio: 4 / 3;
    }

    .back {
        top: 3%;
        left: 3%;
        font-size: 8px;
        gap: 3px;
    }

    .back .arrow {
        font-size: 17px;
    }

    .basket-area {
        left: 29%;
        top: 29%;
        width: 42%;
        height: 44%;
    }

    .basket-title {
        font-size: clamp(20px, 4.8vw, 29px);
        width: 78%;
    }

    .speaker {
        left: 2%;
        top: 17%;
        width: 17%;
        height: 19%;
    }

    .laspalmas {
        right: 2%;
        top: 16%;
        width: 18%;
        height: 20%;
    }

    .realmadrid {
        left: 2%;
        bottom: 7%;
        width: 18%;
        height: 21%;
    }

    .playstation {
        right: 2%;
        bottom: 7%;
        width: 19%;
        height: 19%;
    }

    .beer {
        left: 14%;
        top: 44%;
        width: 12%;
        height: 18%;
    }

    .hoodie {
        right: 13%;
        top: 44%;
        width: 15%;
        height: 18%;
    }

    .nba {
        left: 41%;
        bottom: 1%;
        width: 17%;
        height: 16%;
    }

    .extra-one {
        left: 21%;
        top: 14%;
        width: 13%;
        height: 16%;
    }

    .extra-two {
        right: 21%;
        bottom: 6%;
        width: 13%;
        height: 16%;
    }

    .object-description {
        font-size: 9px;
        max-width: 75px;
    }

    .object-name {
        font-size: 7px;
    }

    .explanation-card {
        width: 90%;
        padding: 25px 20px;
    }

    .explanation-card h2 {
        font-size: 32px;
    }

    .explanation-card p {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<main class="magazine">

    <!-- VOLVER AL CALENDARIO -->
    <a class="back" href="../index.html">
        <span class="arrow">←</span>
        <span>Volver al calendario</span>
    </a>

    <!-- CESTA CENTRAL -->
    <div class="basket-area">

        <img
            class="basket-image"
            src="../imagenes/cesta.png"
            alt="Cesta de la compra"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
        >

        <div class="basket-placeholder">
            AQUÍ VA TU PNG<br>DE LA CESTA
        </div>

        <!-- ÚNICO TÍTULO DE LA PÁGINA -->
        <h2 class="basket-title">
            Un poquito de<br>todo lo que eres
        </h2>

    </div>

    <!-- 1. ALTAVOZ -->
    <button class="object speaker"
        onclick="showExplanation('Altavoz de música')">
        <img src="../imagenes/altavoz.png" alt="Altavoz">
        <span class="object-name">Música</span>
        <span class="object-description">Aquí irá tu explicación</span>
    </button>

    <!-- 2. LAS PALMAS -->
    <button class="object laspalmas"
        onclick="showExplanation('Camiseta de la UD Las Palmas')">
        <img src="../imagenes/las-palmas.png" alt="Camiseta UD Las Palmas">
        <span class="object-name">UD Las Palmas</span>
        <span class="object-description">Aquí irá tu explicación</span>
    </button>

    <!-- 3. REAL MADRID -->
    <button class="object realmadrid"
        onclick="showExplanation('Camiseta del Real Madrid')">
        <img src="../imagenes/real-madrid.png" alt="Camiseta Real Madrid">
        <span class="object-name">Real Madrid</span>
        <span class="object-description">Aquí irá tu explicación</span>
    </button>

    <!-- 4. PLAYSTATION -->
    <button class="object playstation"
        onclick="showExplanation('PlayStation')">
        <img src="../imagenes/playstation.png" alt="PlayStation">
        <span class="object-name">PlayStation</span>
        <span class="object-description">Aquí irá tu explicación</span>
    </button>

    <!-- 5. CERVEZA -->
    <button class="object beer"
        onclick="showExplanation('Cerveza')">
        <img src="../imagenes/cerveza.png" alt="Cerveza">
        <span class="object-name">Cerveza</span>
        <span class="object-description">Aquí irá tu explicación</span>
    </button>

    <!-- 6. SUDADERA -->
    <button class="object hoodie"
        onclick="showExplanation('Sudadera')">
        <img src="../imagenes/sudadera.png" alt="Sudadera">
        <span class="object-name">Sudadera</span>
        <span class="object-description">Aquí irá tu explicación</span>
    </button>

    <!-- 7. NBA -->
    <button class="object nba"
        onclick="showExplanation('NBA')">
        <img src="../imagenes/nba.png" alt="Símbolo NBA">
        <span class="object-name">NBA</span>
        <span class="object-description">Aquí irá tu explicación</span>
    </button>

    <!-- 8. OBJETO NUEVO -->
    <button class="object extra-one"
        onclick="showExplanation('Objeto 8')">
        <img src="../imagenes/objeto-8.png" alt="Objeto 8">
        <span class="object-name">Objeto 8</span>
        <span class="object-description">Aquí irá tu explicación</span>
    </button>

    <!-- 9. OBJETO NUEVO -->
    <button class="object extra-two"
        onclick="showExplanation('Objeto 9')">
        <img src="../imagenes/objeto-9.png" alt="Objeto 9">
        <span class="object-name">Objeto 9</span>
        <span class="object-description">Aquí irá tu explicación</span>
    </button>

    <!-- DETALLES DECORATIVOS -->
    <span class="star star-1">✧</span>
    <span class="star star-2">✳</span>
    <span class="star star-3">✧</span>
    <span class="star star-4">✳</span>
    <span class="star star-5">·</span>
    <span class="star star-6">✧</span>

    <!-- VENTANA AL PULSAR -->
    <div class="explanation" id="explanation"
        onclick="closeExplanation(event)">

        <div class="explanation-card">
            <button class="close" onclick="hideExplanation()">×</button>
            <h2 id="explanation-title"></h2>
            <p id="explanation-text"></p>
        </div>
    </div>

</main>

<script>

/* CAMBIA AQUÍ LOS MENSAJES QUE APARECEN AL PULSAR */

const explanations = {

    "Altavoz de música":
        "Aquí escribe por qué has elegido la música para describirle.",

    "Camiseta de la UD Las Palmas":
        "Aquí escribe qué representa este equipo para él.",

    "Camiseta del Real Madrid":
        "Aquí escribe qué significa el Real Madrid para él.",

    "PlayStation":
        "Aquí escribe por qué has elegido la PlayStation.",

    "Cerveza":
        "Aquí escribe qué representa este objeto para él.",

    "Sudadera":
        "Aquí escribe por qué has elegido esta sudadera.",

    "NBA":
        "Aquí escribe qué representa el baloncesto para él.",

    "Objeto 8":
        "Aquí escribe la explicación del octavo objeto.",

    "Objeto 9":
        "Aquí escribe la explicación del noveno objeto."

};

function showExplanation(object) {

    document.getElementById("explanation-title").textContent = object;

    document.getElementById("explanation-text").textContent =
        explanations[object];

    document.getElementById("explanation").classList.add("active");
}

function hideExplanation() {

    document.getElementById("explanation").classList.remove("active");
}

function closeExplanation(event) {

    if (event.target.id === "explanation") {
        hideExplanation();
    }
}

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        hideExplanation();
    }

});

</script>

</body>
</html>
