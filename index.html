
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24 días para ti</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --green: #18372e;
  --deep: #102820;
  --red: #762e36;
  --gold: #c9a76b;
  --cream: #f3eddf;
  --muted: #c6bda9;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  background:
    radial-gradient(ellipse at 50% 0%, #29483b 0%, transparent 55%),
    var(--deep);
  font-family: 'DM Sans', sans-serif;
  text-align: center;
}

header {
  padding: 65px 20px 30px;
}

.topline {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 5px;
  text-transform: uppercase;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: clamp(52px, 10vw, 88px);
  line-height: 0.95;
  margin: 27px 0 15px;
}

h1 span {
  color: var(--gold);
  font-style: italic;
}

.intro {
  color: var(--muted);
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px;
  line-height: 1.5;
  margin: 20px auto;
}

.ornament {
  color: var(--gold);
  letter-spacing: 8px;
  margin: 24px;
  font-size: 17px;
}

.section-title {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin: 28px 0;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 13px;
  width: min(90%, 620px);
  margin: 0 auto 65px;
}

.day {
  position: relative;
  min-width: 0;
  aspect-ratio: 1 / 1.08;
  background: rgba(243,237,223,0.045);
  border: 1px solid rgba(201,167,107,0.55);
  color: var(--cream);
  font-family: 'Cormorant Garamond', serif;
  cursor: pointer;
  transition: 0.3s ease;
}

.day .number {
  display: block;
  font-size: clamp(28px, 5vw, 39px);
}

.day .label {
  display: block;
  color: var(--gold);
  font-family: 'DM Sans', sans-serif;
  font-size: 8px;
  letter-spacing: 2px;
  margin-top: 5px;
}

.day:not(:disabled):hover {
  background: var(--red);
  border-color: var(--gold);
  transform: translateY(-5px);
}

.day:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}

.day.today {
  background: var(--red);
  border: 1px solid var(--gold);
  box-shadow: 0 0 22px rgba(201,167,107,0.16);
}

.day.opened {
  background: rgba(201,167,107,0.12);
}

.day.opened .number {
  color: var(--gold);
}

footer {
  border-top: 1px solid rgba(201,167,107,0.25);
  padding: 25px;
  color: var(--muted);
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
}

#surprise {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: var(--deep);
  overflow-y: auto;
  padding: 25px;
}

#surprise.visible { display: block; }

.page {
  max-width: 650px;
  margin: 55px auto;
  padding: 40px 25px;
  border: 1px solid var(--gold);
  min-height: 65vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.page .eyebrow {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
}

.page h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(40px, 8vw, 65px);
  font-weight: 400;
  margin: 22px 0;
}

.page p {
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px;
  line-height: 1.6;
  color: var(--muted);
}

.close {
  align-self: center;
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--cream);
  padding: 13px 25px;
  margin-top: 35px;
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
}

.close:hover { background: var(--red); }

@media (max-width: 420px) {
  header { padding-top: 48px; }
  .calendar { gap: 8px; width: 92%; }
  .day .label { letter-spacing: 1px; font-size: 7px; }
  .page { padding: 30px 18px; }
}
</style>
</head>

<body>

<header>
  <div class="topline">Un pequeño regalo · 2026</div>

  <h1>24 días <span>para ti</span></h1>

  <div class="ornament">✦ ───── ♡ ───── ✦</div>

  <p class="intro">
    Diciembre tiene 24 días.<br>
    Y todos tienen algo para ti.
  </p>
</header>

<main>
  <div class="section-title">Coleccion de diciembre</div>
  <div class="calendar" id="calendar"></div>
</main>

<footer>
  De Clarita para ti · Navidades 2026
</footer>

<div id="surprise">
  <div class="page">
    <div class="eyebrow" id="dayNumber"></div>
    <h2 id="dayTitle"></h2>
    <div class="ornament">✦ ♡ ✦</div>
    <p id="dayMessage"></p>
    <button class="close" onclick="closeSurprise()">
      Volver a diciembre
    </button>
  </div>
</div>

<script>
const year = 2026;
const calendar = document.getElementById("calendar");

for (let i = 1; i <= 24; i++) {
  const button = document.createElement("button");
  const date = new Date(year, 11, i);
  const today = new Date();

  today.setHours(0, 0, 0, 0);

  button.className = "day";
  button.innerHTML = `
    <span class="number">${String(i).padStart(2, "0")}</span>
    <span class="label">${date > today ? "LOCKED" : "OPEN"}</span>
  `;

  if (date > today) {
    button.disabled = true;
  } else {
    button.onclick = () => openSurprise(i);
  }

  if (date.toDateString() === today.toDateString()) {
    button.classList.add("today");
  }

  calendar.appendChild(button);
}

function openSurprise(day) {
  document.getElementById("dayNumber").textContent =
    "DECEMBER · DAY " + day;

  document.getElementById("dayTitle").textContent =
    "Una historia para ti";

  document.getElementById("dayMessage").textContent =
    "Aquí empieza tu sorpresa. Pronto encontrarás algo especial en esta página.";

  document.getElementById("surprise").classList.add("visible");
}

function closeSurprise() {
  document.getElementById("surprise").classList.remove("visible");
}
</script>

</body>
</html>
